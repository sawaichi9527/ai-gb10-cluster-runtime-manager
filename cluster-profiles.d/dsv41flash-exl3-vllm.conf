# =====================================================================
# dsv41flash-exl3-vllm — DeepSeek-V4.1-Flash-1017 (EXL3 2.9bpw), 2× GB10
# =====================================================================
# Lane type: LAUNCH_STYLE="kit". The upstream MiaAI-Lab kit owns the whole
# two-node launcher (start.sh in KIT_DIR): it stages weights over CX7, runs
# rank1 then rank0, and serves the OpenAI API. `scripts/cluster-up` therefore
# does NOT render a compose file for this profile — it runs the kit launcher,
# waits for /health, and marks readiness. Nothing model-specific is hard-coded
# in the cluster scripts.
#
# Verified state (2026-10-20):
#   - weights  : 43 EXL3 shards + 1017 Engram shards 47/48, mirrored to both
#                nodes over CX7 (quant 377.6 MB/s, engram 364.4 MB/s)
#   - image    : digest sha256:2f0cf3ad… (= :latest; the only published tag set)
#   - endpoint : http://192.168.23.215:1234/v1  (LAN; CX7 is cluster-internal)
#   - context  : 262144, 8 seqs, vision on, SPEC_METHOD=none
#   - measured : C1 24.2-24.9 tok/s, C2 36.9, C8 79.3 (no-spec)
#   - DSpark is a net loss on this pack/image (acceptance 20-22%), so spec is
#     deliberately disabled. See handoff.md 2026-10-20 sections.
# =====================================================================
PROFILE_ID="dsv41flash-exl3-vllm"
DISPLAY_NAME="DeepSeek-V4.1-Flash-1017 EXL3 2.9bpw (Mia vLLM kit, no-spec)"
PLACEHOLDER="false"
LAUNCH_STYLE="kit"

# ---- kit launcher (node-local; same absolute path is NOT required on node1:
# the kit itself reaches the worker over ssh) ----
KIT_DIR="${HOME}/docker-stacks/mia-vllm-dsv41flash"
KIT_START="./start.sh"
KIT_STOP="./start.sh stop"
KIT_LOG_NAME="kit.log"
# Containers created by the kit (used by cluster-status/-down).
KIT_HEAD_CONTAINER="dsv41-exl3-head"
KIT_WORKER_CONTAINER="dsv41-exl3-worker"

# ---- image (pulled by the kit; pinned here for reference/diagnostics) ----
IMAGE="ghcr.io/miaai-lab/deepseek-v4.1-flash-exl3-2x-dgx-sparks:2.9bpw"
IMG_SHA256="sha256:2f0cf3adc0f989c1d446be274df864eb799630175f604c3b22b71b7205971dce"

# ---- model locations (shared pool; the kit reads them through its own .env
# at ${KIT_DIR}/.env — kept here so status/doctor can resolve the path) ----
MODELS_BASE="${HOME}/docker-stacks/models"
BODY_REL="deepseek-v4.1-flash-1017-exl3-2.9bpw"
# Engram tables live beside the checkpoint (not a BODY_REL):
#   ${MODELS_BASE}/deepseek-v4.1-flash-1017-engram

# ---- endpoint / boot ----
API_PORT=1234
HEALTH_TIMEOUT=1800
SERVED_MODEL="DeepSeek-v4.1-Flash-EXL3"
