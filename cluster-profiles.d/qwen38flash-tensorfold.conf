# =====================================================================
# qwen38flash-tensorfold — Qwen3.8 Flash-Next 125B NVFP4, TensorFold TP2
# =====================================================================
# PEER lane, not a primary/backup pair (same rule as the two 1017 lanes):
# `qwen38flash` (vLLM TP2+EP, MTP3) and this one serve the SAME checkpoint
# (`qwen3.8-flash-next-nvfp4`, shared pool) on different engines; pick per
# workload, switch with `gb10 use`. They are mutually exclusive like every
# other TP2 lane (both GB10s + :1234), so only one is ever live.
#
# LAUNCH_STYLE="kit": the upstream MiaAI-Lab recipe owns the two-node
# launcher (`./start.sh` starts rank 1 on the worker over ssh, then rank 0
# here, checks the CX7 link, waits for load, runs a smoke test; `./stop.sh`
# stops both). `scripts/cluster-up` therefore runs the launcher instead of
# rendering a compose file — there is NO docker-compose for this lane, and
# that is deliberate: a compose file can only describe one node, while rank 1
# needs rank 0's rendezvous address and the identical argv.
#
# Upstream: github.com/MiaAI-Lab/Qwen3.8-Flash-Dual-DGX-Sparks-TensorFold
#   pinned checkout : f8287ef40319  (= v1.1, the release this image was built
#                     from; upstream main has moved to 6730319e "Unreleased",
#                     whose patch set gives a different image hash and would
#                     make prepare.sh build locally)
#   image           : ghcr.io/miaai-lab/qwen3.8-flash-dual-dgx-sparks-tensorfold
#                     :zig-db28187-f3e1300f4f62  (arm64, 10.6 GiB compressed,
#                     labels tf.patches=f3e1300f4f62 / tf.kernels=present)
#   digest          : sha256:e188128d…e18c (CHANGELOG v1.1)
#   engine          : TensorFold db281878 (branch zig-flashnext) + patches
#                     0001-0009, Zig 0.17.0, AOT Triton set for sm_121
#
# Verified 2026-10-21/22 (first deploy — see
# docs/QWEN38FLASH_TENSORFOLD_DEPLOY_2026-10-22.md):
#   - weights : `~/docker-stacks/models/qwen3.8-flash-next-nvfp4` on BOTH nodes,
#               25 files / 124 GiB, byte-for-byte the official
#               `nvidia/Qwen3.8-Flash-Next-NVFP4` @ fc694b54 file set (same
#               per-file sizes), model_type qwen4_exp, producer modelopt.
#               SHARED with the vLLM lane — never delete or "clean" it.
#               The engine resolves it through a Hugging Face cache bridge
#               (RELATIVE symlink, because start.sh bind-mounts HF_CACHE at
#               /root/.cache/huggingface and an absolute host target dangles
#               inside the container):
#                 HF_CACHE = ~/docker-stacks/models
#                 models/hub/models--nvidia--Qwen3.8-Flash-Next-NVFP4/snapshots/fc694b54…
#                   -> ../../../qwen3.8-flash-next-nvfp4
#               On BOTH nodes. Nothing is copied and nothing is downloaded
#               (prepare.sh's manifest compare sees the worker's identical tree).
#   - measured: 262,144 context (YaRN OFF, the native window), PARALLEL 8,
#               KV_DTYPE fp8, VISION 1 -> KV pool 33.33 GiB (528 B/pos/layer);
#               boot -> /health 1m53s; decode C1 55.0 / C2 82.5 / C4 150.3 /
#               C8 287.2 tok/s (fixed 400, BENCH_IGNORE_EOS); cold prefill
#               3,465 / 3,240 / 2,989 tok/s (32K/131K/261K).
#               A/B vs the vLLM lane in the same session: +35.5/+96.4/+67.9/
#               +82.2 % decode and +25/+15/+17 % prefill.
#   - endpoint: http://192.168.23.215:1234/v1, model id "aeon", same
#               VLLM_API_KEY as every other lane (TENSORFOLD_API_KEY in the
#               kit's .env), 401 without it.
#
# GOTCHAS (all measured, do not "fix"):
#   * `cluster-up`'s kit preflight only checks that IMAGE EXISTS on node0, and
#     it inspects the IMAGE string above (the registry ref). After pulling, also
#     `docker tag <pulled ref> tensorfold-qwen38fn:zig-db28187` and tag the local
#     name with THIS ref, otherwise the boot dies with
#     "kit image not present on node0".
#   * `scripts/prepare.sh` MUST run with MEM_CHECK=0 while another TP2 lane is
#     live: it refuses a Spark below MEM_FLOOR_GIB (10 GiB) MemAvailable, and a
#     live vLLM lane leaves node0 right at that floor. Add PULL=0 (never let
#     node1 pull over WAN) and HF_HUB_OFFLINE=1 (the shared checkpoint is
#     already there; otherwise prepare tries a 124 GiB download).
#   * prepare.sh only uses the prebuilt image when its own image_hash() (patches
#     + Dockerfile + TF ref + Zig + base) equals the image's tf.patches label.
#     Keep the checkout pinned at f8287ef40319; otherwise it silently switches
#     to a local build (Zig 0.17 + ~20-40 min).
#   * The engine refuses `response_format` / `guided_*`, `logprobs` and n>1
#     with HTTP 400; thinking is ON by default (a small max_tokens can come
#     back with empty content). Both are service contracts, not bugs.
#   * The two ranks use the SAME container name (`qwen38-fn-tf`), so
#     cluster-status/-down must look on both nodes (they do).
# =====================================================================
PROFILE_ID="qwen38flash-tensorfold"
DISPLAY_NAME="Qwen3.8 Flash-Next 125B NVFP4 (TensorFold TP2, 256K, MTP drafts)"
PLACEHOLDER="false"
LAUNCH_STYLE="kit"

# ---- kit launcher (upstream clone; node-local, node1 needs no copy) ----
KIT_DIR="${HOME}/docker-stacks/mia-TensorFold-qwen38flashNext"
KIT_START="./start.sh"
KIT_STOP="./stop.sh"
KIT_LOG_NAME="kit.log"
# The recipe uses the SAME container name on both ranks.
KIT_HEAD_CONTAINER="qwen38-fn-tf"
KIT_WORKER_CONTAINER="qwen38-fn-tf"

# ---- published image (pulled once on node0, streamed to node1 over CX7) ----
IMAGE="ghcr.io/miaai-lab/qwen3.8-flash-dual-dgx-sparks-tensorfold:zig-db28187-f3e1300f4f62"
IMG_SHA256="sha256:e188128ddabdc67ac02c05781f5c0c6b348db5f050cac297861d82b7f086e18c"

# ---- shared checkpoint (SAME directory the vLLM lane serves) ----
MODELS_BASE="${HOME}/docker-stacks/models"
BODY_REL="qwen3.8-flash-next-nvfp4"
# No drafter: MTP is inside the checkpoint (model-fp8-mtp-ple.safetensors).
DRAF_REL=""

# ---- endpoint / boot ----
API_PORT=1234
# Cold boot: image/checkpoint already prepared, then both ranks load half the
# weights (~2-4 min) and the launcher's own smoke test runs.
HEALTH_TIMEOUT=2400
# One external model id for the whole cluster ("aeon"). The kit's .env sets
# SERVED_NAME=aeon; keep both sides in sync.
SERVED_MODEL="aeon"
