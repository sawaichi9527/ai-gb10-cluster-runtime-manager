#!/usr/bin/env bash
# =====================================================================
# 35b cluster profile — Qwen3.6 35B-A3B (body + DFlash drafter)
# Authoritative profile data; consumed by scripts/cluster-common.sh loader.
# All model-specific vLLM settings live here (not in the TP2 engine).
# Values preserved exactly from pre-refactor set_profile() (verified 2026-08-30).
# =====================================================================
PROFILE_ID="35b"
DISPLAY_NAME="Qwen3.6 35B-A3B"
PLACEHOLDER="false"

# Launch mechanism: compose (unified lane; docker-run was removed 2026-09-20).
# cluster-up renders docker-compose.yml per launch from this same profile data.
LAUNCH_STYLE="compose"

# Node-local stack dir, named after the IMAGE SOURCE
# (ghcr.io/aeon-7/aeon-vllm-ultimate). Renamed from `aeon-vllm-omni` on
# 2026-11-26: the dir now holds compose/patch artifacts only — the weights live
# in the shared pool (see MODELS_BASE below). 35b runs both cluster and single,
# so the two compose artifacts are lane-suffixed; the single one lives in
# runtimes.d and its image comes from standalone.env AEON_IMAGE, NOT from here.
STACK_DIR="${HOME}/docker-stacks/aeon-vllm-ultimate"
COMPOSE_FILE="docker-compose-35b-cluster.yml"

# Health wait budget (s). The 0.33 image cold-booted in 7 min, so the 2400
# default is ample; 3600 is kept because that is the configuration actually
# validated in the 2026-11-26 A/B (see docs/QWEN_27B_35B_AEON_033_UPGRADE).
HEALTH_TIMEOUT="3600"

# Per-profile image (overrides the cluster-global tp2.env IMG fallback).
# 0.33 bump promoted 2026-11-26: parity within noise (Sigma -3.1 % over two
# boots), single-stream C1 109.8 -> 123.8/147.0, 245K prefill +4.2 %.
# 27b deliberately stays on 2026-09-18 (its 0.33 decode regression is real).
IMAGE="ghcr.io/aeon-7/aeon-vllm-ultimate:2026-11-23-v0.33.0-omni-dflash2"
# Same digest on BOTH nodes (node1 pulls natively; node0 re-attaches it with a
# no-op `docker pull` after the CX7 save|load), so no IMG_SHA256_NODE1.
IMG_SHA256="sha256:71c2b82b3b0c97ddca9ef35b279fb745ee0abe29b762a24c8c0771cf930f11ab"

# Model relative paths under $MODELS_BASE (resolved by the loader).
# Shared pool since 2026-11-26 (was ${HOME}/docker-stacks/aeon-vllm-omni/models);
# same value as cluster-common.sh's _DEFAULT_MODELS_BASE, spelled out because
# BODY_REL/DRAF_REL below are resolved against it.
MODELS_BASE="$HOME/docker-stacks/models"
BODY_REL="qwen3.6-35b-a3b-heretic-nvfp4"
DRAF_REL="qwen3.6-35b-a3b-dflash"

# Context / concurrency / GMU
MAXLEN="262144"
NUMSEQ="8"
BATCHED="16384"
GMU="0.80"
NSPEC="6"

# Model-specific vLLM settings (profile-owned).
KV_DTYPE="bfloat16"
ATTN_BACKEND="flash_attn"
SPEC_METHOD="dflash"
SPEC_ATTN_BACKEND="flash_attn"
GRAPH_MODE="FULL_AND_PIECEWISE"
# 0.29 B0: disable fused all-reduce RMS norm.
PASS_CONFIG='{"fuse_allreduce_rms":false}'
REASONING_PARSER="qwen3"
TOOL_CALL_PARSER="qwen3_coder"
ENABLE_AUTO_TOOL_CHOICE="true"
ENABLE_CHUNKED_PREFILL="true"
ENABLE_PREFIX_CACHING="true"

# Lane-isolated vLLM/compile cache root. Cluster and single MUST NOT share a
# root (a stale rank-keyed FlashInfer autotune file deadlocks a TP2 boot), so
# 35b-cluster and 35b-single each get their own ~/.cache/vllm-<lane> tree.
EXTRA_ENV=(
  VLLM_CACHE_ROOT=/cache/vllm
  VLLM_ALLREDUCE_USE_FLASHINFER=0
  VLLM_USE_FLASHINFER_SAMPLER=0
)
EXTRA_MOUNTS=(
  -v "${HOME}/.cache/vllm-35b-cluster:/cache/vllm"
)

# Per-boot FlashInfer autotune reset follows this (see cluster-common.sh).
AUTOTUNE_CACHE_REL=".cache/vllm-35b-cluster/flashinfer_autotune_cache"
