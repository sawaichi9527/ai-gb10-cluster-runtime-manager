#!/usr/bin/env bash
# =====================================================================
# 35b cluster profile — Qwen3.6 35B-A3B (body + DFlash drafter)
# Authoritative profile data; consumed by scripts/cluster-common.sh loader.
# All model-specific vLLM settings live here (not in the TP2 engine).
# Values preserved exactly from pre-refactor set_profile() (verified 2026-08-30).
# =====================================================================
PROFILE_ID="35b"
DISPLAY_NAME="Qwen3.6 35B-A3B"
PLACEHOLDER="false"

# Launch mechanism: compose (unified lane; docker-run was removed 2026-09-20).
# cluster-up renders docker-compose.yml per launch from this same profile data.
LAUNCH_STYLE="compose"

# Per-profile image (overrides the cluster-global tp2.env IMG fallback).
IMAGE="ghcr.io/aeon-7/aeon-vllm-ultimate:2026-09-18-v0.29.0-omni"

# Model relative paths under $MODELS_BASE (resolved by the loader).
MODELS_BASE="$HOME/docker-stacks/aeon-vllm-omni/models"
BODY_REL="qwen3.6-35b-a3b-heretic-nvfp4"
DRAF_REL="qwen3.6-35b-a3b-dflash"

# Context / concurrency / GMU
MAXLEN="262144"
NUMSEQ="8"
BATCHED="16384"
GMU="0.80"
NSPEC="6"

# Model-specific vLLM settings (profile-owned).
KV_DTYPE="bfloat16"
ATTN_BACKEND="flash_attn"
SPEC_METHOD="dflash"
SPEC_ATTN_BACKEND="flash_attn"
GRAPH_MODE="FULL_AND_PIECEWISE"
# 0.29 B0: disable fused all-reduce RMS norm.
PASS_CONFIG='{"fuse_allreduce_rms":false}'
REASONING_PARSER="qwen3"
TOOL_CALL_PARSER="qwen3_coder"
ENABLE_AUTO_TOOL_CHOICE="true"
ENABLE_CHUNKED_PREFILL="true"
ENABLE_PREFIX_CACHING="true"

# Cache convergence to ~/.cache/huggingface (Phase 3); persists HF + vLLM
# compile/kernel cache across boots.
EXTRA_ENV=(
  VLLM_CACHE_ROOT=/cache/huggingface/vllm-cache
  VLLM_USE_V2_MODEL_RUNNER=1 # 0.29: pin V2 explicitly; image default is mrv2-default-routing
  VLLM_ALLREDUCE_USE_FLASHINFER=0
  VLLM_USE_FLASHINFER_SAMPLER=0
)
EXTRA_MOUNTS=(
  -v "${HOME}/.cache/huggingface:/cache/huggingface"
  # 0.29 DFlash flash_attn regression: accept use_mm_prefix kwarg (bind patched impl).
  -v "${HOME}/docker-stacks/aeon-vllm-omni/flash_attn_029_patched.py:/usr/local/lib/python3.12/site-packages/vllm/v1/attention/backends/flash_attn.py"
)
