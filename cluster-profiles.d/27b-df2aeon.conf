#!/usr/bin/env bash
# =====================================================================
# 27b TP2 candidate — z-lab -> AEON DFlash2 drafter + probabilistic drafts
#
# NOT a service. Same image (2026-09-18), same body, same contract as the
# production 27b profile; only the drafter and its spec config change.
#
# The vendor prescribes FIXED n=7 (no lattice) for TP=2, unlike single-node
# where the per-batch-size lattice applies. Everything else — GMU 0.85,
# 262144 ctx, 8 seqs, TRITON_ATTN, fp8_e4m3 KV, PASS_CONFIG
# fuse_allreduce_rms:false, prefix caching OFF — is unchanged on purpose.
#
# Why: the same drafter change measured +32.1 % Sigma on one Spark
# (docs/QWEN_27B_35B_AEON_033_UPGRADE_2026-11-26.md section 9). This lane asks
# whether TP2 sees a comparable gain before anything is promoted.
# =====================================================================
PROFILE_ID="27b-df2aeon"
DISPLAY_NAME="Qwen3.8 27B (A/B: AEON DFlash2 drafter, TP2)"
PLACEHOLDER="false"

LAUNCH_STYLE="compose"

STACK_DIR="${HOME}/docker-stacks/aeon-vllm-ultimate"
COMPOSE_FILE="docker-compose-27b-df2aeon-cluster.yml"

HEALTH_TIMEOUT="3600"

# Unchanged from production 27b: the image generation is NOT part of this A/B.
IMAGE="ghcr.io/aeon-7/aeon-vllm-ultimate:2026-09-18-v0.29.0-omni"

MODELS_BASE="$HOME/docker-stacks/models"
BODY_REL="qwen3.8-27b-aeon-ultimate-uncensored-nvfp4-mixed"
DRAF_REL="qwen3.8-27b-dflash2-aeon"

MAXLEN="262144"
NUMSEQ="8"
BATCHED="16384"
GMU="0.85"
NSPEC="7"

QUANTIZATION="none"
KV_DTYPE="fp8_e4m3"
ATTN_BACKEND="TRITON_ATTN"
SPEC_METHOD="dflash"
SPEC_ATTN_BACKEND="TRITON_ATTN"
# Vendor's TP=2 shape: fixed 7 drafts (the lattice is a 1-Spark setting) plus
# probabilistic drafting. Raw override so NSPEC/SPEC_METHOD stay informative.
SPEC_CONFIG='{"method":"dflash","model":"/drafter","num_speculative_tokens":7,"attention_backend":"TRITON_ATTN","draft_sample_method":"probabilistic"}'
GRAPH_MODE="FULL_AND_PIECEWISE"
PASS_CONFIG='{"fuse_allreduce_rms":false}'
REASONING_PARSER="qwen3"
TOOL_CALL_PARSER="qwen3_coder"
ENABLE_AUTO_TOOL_CHOICE="true"
ENABLE_CHUNKED_PREFILL="true"
ENABLE_PREFIX_CACHING="false"

EXTRA_ENV=(
  VLLM_CACHE_ROOT=/cache/vllm
  VLLM_USE_V2_MODEL_RUNNER=1
  VLLM_ALLREDUCE_USE_FLASHINFER=0
  VLLM_USE_FLASHINFER_SAMPLER=0
)
EXTRA_MOUNTS=(
  -v "${HOME}/.cache/vllm-27b-df2aeon-cluster:/cache/vllm"
)

AUTOTUNE_CACHE_REL=".cache/vllm-27b-df2aeon-cluster/flashinfer_autotune_cache"
