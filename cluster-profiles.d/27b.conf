#!/usr/bin/env bash
# =====================================================================
# 27b cluster profile — Qwen3.8 27B (body + DFlash2 drafter)
# Authoritative profile data; consumed by scripts/tp2-common.sh loader.
# All model-specific vLLM settings live here (not in the TP2 engine).
# Values preserved exactly from pre-refactor set_profile() (verified 2026-08-30).
# =====================================================================
PROFILE_ID="27b"
DISPLAY_NAME="Qwen3.8 27B"
PLACEHOLDER="false"

# Per-profile image (overrides the cluster-global tp2.env IMG fallback).
IMAGE="ghcr.io/aeon-7/aeon-vllm-ultimate:2026-08-24-v0.27.1-omni"

# Model relative paths under $MODELS_BASE (resolved by the loader).
BODY_REL="qwen3.8-27b-aeon-ultimate-uncensored-nvfp4"
DRAF_REL="qwen3.8-27b-dflash2"

# Context / concurrency / GMU
MAXLEN="262144"
NUMSEQ="8"
BATCHED="16384"
GMU="0.85"
NSPEC="7"

# Model-specific vLLM settings (profile-owned).
KV_DTYPE="fp8_e4m3"
ATTN_BACKEND="TRITON_ATTN"
SPEC_METHOD="dflash"
SPEC_ATTN_BACKEND="TRITON_ATTN"
GRAPH_MODE="FULL_AND_PIECEWISE"
REASONING_PARSER="qwen3"
TOOL_CALL_PARSER="qwen3_coder"
ENABLE_AUTO_TOOL_CHOICE="true"
ENABLE_CHUNKED_PREFILL="true"
ENABLE_PREFIX_CACHING="false"
