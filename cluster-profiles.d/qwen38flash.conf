#!/usr/bin/env bash
# =====================================================================
# qwen38flash cluster profile — Qwen3.8 Flash-Next 125B (NVIDIA NVFP4)
# Authoritative profile data; consumed by scripts/cluster-common.sh loader.
#
# Rewritten 2026-09-20 for the restructured loader (compose-only lane), ported
# from MiaAI-Lab/Qwen3.8-Flash-Next-Dual-DGX-Sparks (AGPL-3.0). Runtime support
# is vendored in patches/qwen38flash/ and applied INSIDE the container by
# CMD_WRAPPER: the image's own vLLM sources are patched in place at start (no
# image rebuild, idempotent per boot) — PLE, ModelOpt MXFP8 + FP8_BLOCK_SCALES,
# QSA FP8-KV, the reduced-vocab MTP drafter, plus (2026-09-29) the vllm#53388
# block-drop backport and the opt-in determinism knobs. The 47,149-id draft
# vocabulary is bind-mounted read-only. The checkpoint's MTP layer-index alias is
# generated by patches/qwen38flash/prepare.sh (run once on Node0) and
# bind-mounted over /model/{config.json,hf_quant_config.json}.
#
# Realigned to upstream @ 2c86a1d0 on 2026-09-29 (image unchanged: the pinned
# digest is still the only build of vllm/vllm-openai:qwen38-flash-next). The
# original 8 vendored files were re-verified byte-identical at that commit; two
# files were added. Changed with it:
#   GMU 0.835 -> 0.80            (0.835 left <1 GiB/node free; GB10 hard-resets)
#   prefix caching off -> on     (upstream default; enabled together with the
#                                 block-drop backport that makes reuse cheap)
#   + disable_eagle_block_drop, + index_share_for_mtp_iteration
#   + --enable-prompt-tokens-details (per-request cached-token counts)
#
# Verified against the local checkpoint (2026-09-20):
#   PLE dtype            = float8_e4m3fn    (injected via --hf-overrides)
#   MTP MoE quantization = FP8_BLOCK_SCALES (supported by the patched dispatch)
#   MTP layer alias      = required (config.json + hf_quant_config.json)
#
# Serves the unified :1234 OpenAI API as model id "aeon".
# =====================================================================
PROFILE_ID="qwen38flash"
DISPLAY_NAME="Qwen3.8 Flash-Next 125B NVFP4 (MTP3, TP2+EP)"
PLACEHOLDER="false"

# Compose is the only launch lane (since 2026-09-20).
LAUNCH_STYLE="compose"
ENGINE="vllm"

# Node-local stack dir (image-named). qwen38flash is cluster-only.
STACK_DIR="${HOME}/docker-stacks/mia-vllm-openai-qwen38flashNext"
COMPOSE_FILE="docker-compose.qwen38flash.yml"

IMAGE="vllm/vllm-openai:qwen38-flash-next"
# Registry manifest digest gate (fail-fast in cluster-up via
# verify_profile_image_gate). Verified 2026-09-20: RepoDigests[0] is identical
# on node0 (classic image store) and node1 (containerd store) — compare
# RepoDigests, never .Id (the stores report different .Id values).
IMG_SHA256="sha256:fc120ece0a388cc0aa1caad4a9f1cd92113484ab7ec2fd0efadd62585be05bf8"

BODY_REL="qwen3.8-flash-next-nvfp4"
# No drafter: MTP is internal to the body checkpoint.
DRAF_REL=""

# Recipe defaults (MiaAI .env.sample @ 2c86a1d0): 256K / 8-way / 8192 batched / GMU 0.80.
# GMU 0.835 was retired upstream 2026-09-26: the driver held 114.5 GiB/node and a
# mixed-traffic soak left 0.3-0.9 GiB MemAvailable, where GB10 boxes hard-reset.
# 0.80 keeps ~4 GiB more headroom per node; upstream states decode speed does not
# depend on GMU (only the KV pool shrinks, ~32.0 -> ~28 GiB).
MAXLEN="262144"
NUMSEQ="8"
BATCHED="8192"
GMU="0.80"
NSPEC="3"

# Model-specific vLLM settings (profile-owned).
QUANTIZATION="modelopt"
KV_DTYPE="fp8_e4m3"                 # recipe default; needs patch_qsa_fp8_kv.py
# The recipe keeps custom all-reduce (the loader default is to disable it).
DISABLE_CUSTOM_ALL_REDUCE="false"
GRAPH_MODE="FULL_DECODE_ONLY"
# vLLM >= 0.28 schema: mode 0 = no torch.compile (eager), which avoids
# Inductor duplicating the PLE n-gram table on GB10.
COMPILATION_JSON='{"mode":0,"cudagraph_mode":"FULL_DECODE_ONLY"}'
REASONING_PARSER="qwen3"
TOOL_CALL_PARSER="qwen3_coder"
ENABLE_AUTO_TOOL_CHOICE="true"
ENABLE_CHUNKED_PREFILL="true"
# Prefix caching ON since 2026-09-29, to match upstream (README: "Prefix caching |
# on (shared across requests)"). Safe here because CMD_WRAPPER applies the
# vllm#53388 block-drop backport (MTP_DISABLE_BLOCK_DROP in SPEC_CONFIG); upstream
# measures a repeated 7.9k prompt at 2.70 s (miss) -> 0.25 s (hit) and the second
# 9.5k turn TTFT at 3.25 -> 0.63 s. Scope note: qwen38flash is cluster-only, so this
# cannot affect node1's single-node lanes; 27b stays OFF per its own ADR.
ENABLE_PREFIX_CACHING="true"

# Internal MTP n=3 (no /drafter mount). Drafts over the REDUCED 47,149-id
# code-tuned vocabulary vendored from the MiaAI recipe (it measured +9.6%
# aggregate / +15% single-stream vs the full 248,320 head by shrinking the
# drafter's lm_head read); use_local_argmax_reduction also cuts the draft
# all-gather from O(vocab_size) to O(2*tp_size). Output-safe: a draft outside
# the subset is rejected at verification, never emitted.
# disable_eagle_block_drop: keep the trailing prefix-cache block on each turn
# (vllm#53388 backport, applied by CMD_WRAPPER); without it every prefix-cache hit
# costs one full cache block (~1,664 tokens at MTP 3) of extra re-prefill.
# index_share_for_mtp_iteration: reuse the QSA top-k across MTP draft steps
# (upstream: code decode +6% at S=1 to +27% at S=8, prose within noise).
SPEC_CONFIG='{"method":"mtp","num_speculative_tokens":3,"use_local_argmax_reduction":true,"disable_eagle_block_drop":true,"index_share_for_mtp_iteration":true}'

# Recipe extras the shared builder does not cover. --hf-overrides pins the PLE
# dtype recovered from this checkpoint (detect_ple_dtype.py -> float8_e4m3fn).
EXTRA_ARGS=(
  # Upstream sets this unconditionally (start.sh step 7): per-request cached-token
  # counts in the usage payload — also what lets us verify prefix-cache hits.
  --enable-prompt-tokens-details
  --mamba-ssm-cache-dtype bfloat16
  --load-format safetensors
  --safetensors-load-strategy lazy
  --distributed-executor-backend mp
  --mm-encoder-tp-mode data
  --enable-expert-parallel
  --all2all-backend allgather_reducescatter
  --hf-overrides
  '{"text_config":{"ple_embedding_dtype":"float8_e4m3fn"}}'
)

# Container env from the recipe (offline + RoCE). NCCL_IB_HCA / GID_INDEX /
# VLLM_HOST_IP / GLOO_SOCKET_IFNAME / NCCL_SOCKET_IFNAME come from the builder.
EXTRA_ENV=(
  HF_HUB_OFFLINE=1
  TRANSFORMERS_OFFLINE=1
  TP_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME}
  NCCL_IB_DISABLE=0
  NCCL_IB_AUTO_DETECT=0
  NCCL_DEBUG=WARN
  VLLM_MTP_DRAFT_VOCAB=/etc/vllm-draft-vocab.txt
  VLLM_CACHE_ROOT=/cache/vllm
)

# Deterministic greedy decoding — ON by default since 2026-09-29 (opt out with
# Q38_DET_OFF=1 for a single launch). Setting these makes CMD_WRAPPER apply
# patch_determinism.py inside the container: VLLM_QSA_DET_TOPK re-sorts the QSA
# top-k, VLLM_MOE_DET_FINALIZE drops the fused MoE finalize.
# Rationale (vllm-project/vllm#53436, DeepSeek-V4-Flash / Blackwell SM120 spec
# decode): throughput jitters run-to-run at a fixed seed because the target
# forward is not bit-reproducible, and the official escape hatch
# (VLLM_BATCH_INVARIANT) raises NotImplementedError on Blackwell + MXFP4 MoE.
# Measured 2026-09-29 (10 reps per C, temp=0/seed=0): medians unchanged across
# C1-C8 while the spread roughly halves (C1 tok/s CV 9.2% -> 4.5%, C1 acceptance
# CV 19.4% -> 0.0%) — see README "可重現性".
# Tuning lands in the lane's normal autotune cache: we deliberately do NOT set
# VLLM_FLASHINFER_AUTOTUNE_CACHE_DIR the way upstream does, so the per-boot
# rank-keyed reset above still covers the unfused path.
#   opt-out: Q38_DET_OFF=1 gb10 use qwen38flash
if [[ "${Q38_DET_OFF:-0}" != "1" ]]; then
  EXTRA_ENV+=("VLLM_QSA_DET_TOPK=1" "VLLM_MOE_DET_FINALIZE=1")
fi

# Recipe: --cap-add SYS_NICE. No extra ulimits (PLE stays on GPU: PLE_OFFLOAD=false).
CAP_ADD=( SYS_NICE )

# Runtime patches (staged to BOTH nodes by SYNC_DIRS, then mounted read-only),
# the pre-generated checkpoint-config alias, and a lane-isolated vLLM cache root.
EXTRA_MOUNTS=(
  -v "${STACK_DIR}/patches:/opt/qwen38-patches:ro"
  -v "${STACK_DIR}/patches/config_patched.json:/model/config.json:ro"
  -v "${STACK_DIR}/patches/hf_quant_config_patched.json:/model/hf_quant_config.json:ro"
  -v "${STACK_DIR}/patches/draft_vocab_en_code_47k.txt:/etc/vllm-draft-vocab.txt:ro"
  -v "${HOME}/.cache/vllm-qwen38flash:/cache/vllm"
)
SYNC_DIRS=(
  "${REPO_DIR}/patches/qwen38flash:${STACK_DIR}/patches"
)

# The image enables FlashInfer autotune by default, so its rank-keyed cache
# lands in the lane's cache root above. Point the per-boot reset hook at it:
# reusing a leader-authored cache file deadlocks the two ranks at boot.
AUTOTUNE_CACHE_REL=".cache/vllm-qwen38flash/flashinfer_autotune_cache"

# In-container prelude (MUST stay a single line: the renderer emits it as one
# YAML scalar, then appends the shared `exec vllm serve` argv). Copies the
# vendored patchers and the image's own sources into /tmp, patches them, writes
# the results back over the vLLM package, then execs the server. Steps, in order:
#   PLE -> ModelOpt MXFP8 -> FP8_BLOCK_SCALES -> QSA FP8-KV ->
#   [determinism, opt-in] -> reduced-vocab MTP -> [block-drop vllm#53388].
# The determinism step is inert unless VLLM_QSA_DET_TOPK=1 or
# VLLM_MOE_DET_FINALIZE=1 reaches the container (upstream ships both commented
# out); it must run after patch_qsa_fp8_kv.py, which it edits in place.
# block-drop is fail-closed: a missing anchor aborts the boot rather than
# starting a half-patched engine.
CMD_WRAPPER='P=/usr/local/lib/python3.12/dist-packages/vllm; W=/tmp/q38patch; mkdir -p "$W" || exit 1; cp /opt/qwen38-patches/*.py "$W"/ || exit 1; cp "$P/models/qwen3_8_flash_next/nvidia/ple_layer.py" "$W/ple_layer_patched.py.orig" || exit 1; cp "$P/model_executor/layers/quantization/modelopt.py" "$W/modelopt_patched.py.orig" || exit 1; cp "$P/models/qwen3_8_flash_next/nvidia/ops/qsa.py" "$W/qsa_ops_patched.py.orig" || exit 1; cp "$P/models/qwen3_8_flash_next/nvidia/qsa.py" "$W/qsa_nvidia_patched.py.orig" || exit 1; cp "$P/models/qwen3_8_flash_next/nvidia/mtp.py" "$W/mtp_patched.py.orig" || exit 1; python3 "$W/patch_ple_layer.py" || exit 1; python3 "$W/patch_modelopt_mxfp8.py" || exit 1; python3 "$W/patch_modelopt_fp8_block_moe.py" || exit 1; python3 "$W/patch_qsa_fp8_kv.py" || exit 1; if [ "${VLLM_QSA_DET_TOPK:-0}" = 1 ] || [ "${VLLM_MOE_DET_FINALIZE:-0}" = 1 ]; then mkdir -p "$W/determinism/orig" || exit 1; cp "$P/model_executor/layers/fused_moe/experts/flashinfer_cutlass_moe.py" "$W/determinism/orig/flashinfer_cutlass_moe.py" || exit 1; python3 "$W/patch_determinism.py" || exit 1; cp "$W/determinism/flashinfer_cutlass_moe.py" "$P/model_executor/layers/fused_moe/experts/flashinfer_cutlass_moe.py" || exit 1; echo "[qwen38flash] determinism patch applied"; fi; python3 "$W/patch_mtp_draft_vocab.py" || exit 1; BD="$W/block_drop"; mkdir -p "$BD/orig" || exit 1; for f in $(python3 "$W/patch_block_drop.py" --list); do mkdir -p "$BD/orig/$(dirname "$f")" || exit 1; cp "$P/$f" "$BD/orig/$f" || exit 1; done; python3 "$W/patch_block_drop.py" "$BD/orig" "$BD" || exit 1; for f in $(python3 "$W/patch_block_drop.py" --list); do if [ -f "$BD/$f" ]; then cp "$BD/$f" "$P/$f" || exit 1; fi; done; echo "[qwen38flash] block-drop vllm#53388 applied or already present"; cp "$W/ple_layer_patched.py" "$P/models/qwen3_8_flash_next/nvidia/ple_layer.py" || exit 1; cp "$W/modelopt_patched.py" "$P/model_executor/layers/quantization/modelopt.py" || exit 1; cp "$W/qsa_ops_patched.py" "$P/models/qwen3_8_flash_next/nvidia/ops/qsa.py" || exit 1; cp "$W/qsa_nvidia_patched.py" "$P/models/qwen3_8_flash_next/nvidia/qsa.py" || exit 1; cp "$W/mtp_patched.py" "$P/models/qwen3_8_flash_next/nvidia/mtp.py" || exit 1; echo "[qwen38flash] in-container patches applied"'
