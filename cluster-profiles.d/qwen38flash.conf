#!/usr/bin/env bash
# =====================================================================
# qwen38flash cluster profile — Qwen3.8 Flash-Next 125B (NVIDIA NVFP4)
# Authoritative profile data; consumed by scripts/cluster-common.sh loader.
# Official vllm/vllm-openai:qwen38-flash-next image (vLLM >= 0.28, Qwen4Exp
# support), NVIDIA ModelOpt NVFP4 checkpoint, internal MTP n=3 (no drafter).
# PLE (51B n-gram table, per-tensor FP8 ~47.7GB) is CPU-offloaded via
# VLLM_PLE_CPU_OFFLOAD=1 and streamed through an mmap'd shard set, so the
# nofile ulimit is raised on both ranks.
# =====================================================================
PROFILE_ID="qwen38flash"
DISPLAY_NAME="Qwen3.8 Flash-Next 125B NVFP4 (MTP3)"
PLACEHOLDER="false"

# Per-profile image (overrides the cluster-global tp2.env IMG fallback).
IMAGE="vllm/vllm-openai:qwen38-flash-next"

# Model relative path under $MODELS_BASE (resolved by the loader).
BODY_REL="qwen3.8-flash-next-nvfp4"
# No drafter: DRAF_REL "" => MTP is internal to the body checkpoint.
DRAF_REL=""

# Context / concurrency / GMU
MAXLEN="262144"
NUMSEQ="8"
BATCHED="16384"
GMU="0.80"
NSPEC="3"

# Model-specific vLLM settings (profile-owned).
QUANT="modelopt"
KV_DTYPE="fp8_e4m3"
SPEC_METHOD="mtp"
SPEC_ATTN_BACKEND="FLASH_ATTN"
# vLLM >= 0.28 compilation-config schema uses "mode"; FULL_DECODE_ONLY avoids
# Inductor autotune duplicating the PLE n-gram table on GB10.
GRAPH_MODE="FULL_DECODE_ONLY"
COMPILATION_JSON='{"mode":0,"cudagraph_mode":"FULL_DECODE_ONLY"}'
# 125B body: lazy safetensors load + no flashinfer autotune (NVIDIA recipe).
LOAD_FORMAT="safetensors"
SAFETENSORS_LOAD_STRATEGY="lazy"
ENABLE_FLASHINFER_AUTOTUNE="false"
# Spark flash-next recipes run the distributed executor on "mp".
DISTRIBUTED_EXECUTOR_BACKEND="mp"
# Both ranks: CPU-offload the PLE table; raise fd limit for ~128 mmap shards.
EXTRA_DOCKER_ENV="VLLM_PLE_CPU_OFFLOAD=1"
DOCKER_RUN_EXTRA="--ulimit nofile=1048576 --cap-add SYS_NICE"
REASONING_PARSER="qwen3"
TOOL_CALL_PARSER="qwen3_coder"
ENABLE_AUTO_TOOL_CHOICE="true"
ENABLE_CHUNKED_PREFILL="true"
ENABLE_PREFIX_CACHING="false"