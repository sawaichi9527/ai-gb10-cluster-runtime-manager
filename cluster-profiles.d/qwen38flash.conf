#!/usr/bin/env bash
# =====================================================================
# qwen38flash cluster profile — Qwen3.8 Flash-Next 125B (NVIDIA NVFP4)
# Authoritative profile data; consumed by scripts/cluster-common.sh loader.
#
# Rewritten 2026-09-20 for the restructured loader (compose-only lane),
# ported from MiaAI-Lab/Qwen3.8-Flash-Next-Dual-DGX-Sparks @ d2f54b7
# (AGPL-3.0). Runtime support is vendored in patches/qwen38flash/ and
# applied INSIDE the container by CMD_WRAPPER: the image's own vLLM sources
# are patched in place at start (no image rebuild, idempotent per boot) —
# PLE, ModelOpt MXFP8 + FP8_BLOCK_SCALES, QSA FP8-KV, and the reduced-vocab
# MTP drafter. The 47,149-id draft vocabulary is bind-mounted read-only.
# The checkpoint's MTP layer-index alias is generated by
# patches/qwen38flash/prepare.sh (run once on Node0) and bind-mounted over
# /model/{config.json,hf_quant_config.json}.
#
# Verified against the local checkpoint (2026-09-20):
#   PLE dtype            = float8_e4m3fn    (injected via --hf-overrides)
#   MTP MoE quantization = FP8_BLOCK_SCALES (supported by the patched dispatch)
#   MTP layer alias      = required (config.json + hf_quant_config.json)
#
# Serves the unified :1234 OpenAI API as model id "aeon".
# =====================================================================
PROFILE_ID="qwen38flash"
DISPLAY_NAME="Qwen3.8 Flash-Next 125B NVFP4 (MTP3, TP2+EP)"
PLACEHOLDER="false"

# Compose is the only launch lane (since 2026-09-20).
LAUNCH_STYLE="compose"
ENGINE="vllm"

IMAGE="vllm/vllm-openai:qwen38-flash-next"

BODY_REL="qwen3.8-flash-next-nvfp4"
# No drafter: MTP is internal to the body checkpoint.
DRAF_REL=""

# Recipe defaults (MiaAI .env.sample): 256K / 8-way / 8192 batched / GMU 0.835.
MAXLEN="262144"
NUMSEQ="8"
BATCHED="8192"
GMU="0.835"
NSPEC="3"

# Model-specific vLLM settings (profile-owned).
QUANTIZATION="modelopt"
KV_DTYPE="fp8_e4m3"                 # recipe default; needs patch_qsa_fp8_kv.py
# The recipe keeps custom all-reduce (the loader default is to disable it).
DISABLE_CUSTOM_ALL_REDUCE="false"
GRAPH_MODE="FULL_DECODE_ONLY"
# vLLM >= 0.28 schema: mode 0 = no torch.compile (eager), which avoids
# Inductor duplicating the PLE n-gram table on GB10.
COMPILATION_JSON='{"mode":0,"cudagraph_mode":"FULL_DECODE_ONLY"}'
REASONING_PARSER="qwen3"
TOOL_CALL_PARSER="qwen3_coder"
ENABLE_AUTO_TOOL_CHOICE="true"
ENABLE_CHUNKED_PREFILL="true"
ENABLE_PREFIX_CACHING="false"

# Internal MTP n=3 (no /drafter mount). Drafts over the REDUCED 47,149-id
# code-tuned vocabulary vendored from the MiaAI recipe (it measured +9.6%
# aggregate / +15% single-stream vs the full 248,320 head by shrinking the
# drafter's lm_head read); use_local_argmax_reduction also cuts the draft
# all-gather from O(vocab_size) to O(2*tp_size). Output-safe: a draft outside
# the subset is rejected at verification, never emitted.
SPEC_CONFIG='{"method":"mtp","num_speculative_tokens":3,"use_local_argmax_reduction":true}'

# Recipe extras the shared builder does not cover. --hf-overrides pins the PLE
# dtype recovered from this checkpoint (detect_ple_dtype.py -> float8_e4m3fn).
EXTRA_ARGS=(
  --mamba-ssm-cache-dtype bfloat16
  --load-format safetensors
  --safetensors-load-strategy lazy
  --distributed-executor-backend mp
  --mm-encoder-tp-mode data
  --enable-expert-parallel
  --all2all-backend allgather_reducescatter
  --hf-overrides
  '{"text_config":{"ple_embedding_dtype":"float8_e4m3fn"}}'
)

# Container env from the recipe (offline + RoCE). NCCL_IB_HCA / GID_INDEX /
# VLLM_HOST_IP / GLOO_SOCKET_IFNAME / NCCL_SOCKET_IFNAME come from the builder.
EXTRA_ENV=(
  HF_HUB_OFFLINE=1
  TRANSFORMERS_OFFLINE=1
  TP_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME}
  NCCL_IB_DISABLE=0
  NCCL_IB_AUTO_DETECT=0
  NCCL_DEBUG=WARN
  VLLM_MTP_DRAFT_VOCAB=/etc/vllm-draft-vocab.txt
)

# Recipe: --cap-add SYS_NICE. No extra ulimits (PLE stays on GPU: PLE_OFFLOAD=false).
CAP_ADD=( SYS_NICE )

# Runtime patches (staged to BOTH nodes by SYNC_DIRS, then mounted read-only),
# the pre-generated checkpoint-config alias, and a lane-isolated vLLM cache
# root (~/.cache/vllm is reserved for single-node runtimes per AGENTS.md).
EXTRA_MOUNTS=(
  -v "${HOME}/qwen38flash-patches:/opt/qwen38-patches:ro"
  -v "${HOME}/qwen38flash-patches/config_patched.json:/model/config.json:ro"
  -v "${HOME}/qwen38flash-patches/hf_quant_config_patched.json:/model/hf_quant_config.json:ro"
  -v "${HOME}/qwen38flash-patches/draft_vocab_en_code_47k.txt:/etc/vllm-draft-vocab.txt:ro"
  -v "${HOME}/.cache/vllm-qwen38flash:/root/.cache/vllm"
)
SYNC_DIRS=(
  "${REPO_DIR}/patches/qwen38flash:${HOME}/qwen38flash-patches"
)

# The image enables FlashInfer autotune by default, so its rank-keyed cache
# lands in the lane's cache root above. Point the per-boot reset hook at it
# (default is .cache/huggingface/vllm-cache/...): reusing a leader-authored
# cache file deadlocks the two ranks at boot.
AUTOTUNE_CACHE_REL=".cache/vllm-qwen38flash/flashinfer_autotune_cache"

# In-container prelude (MUST stay a single line: the renderer emits it as one
# YAML scalar, then appends the shared `exec vllm serve` argv). Copies the
# vendored patchers and the image's own sources into /tmp, patches them, writes
# the results back over the vLLM package, then execs the server.
CMD_WRAPPER='P=/usr/local/lib/python3.12/dist-packages/vllm; W=/tmp/q38patch; mkdir -p "$W" || exit 1; cp /opt/qwen38-patches/*.py "$W"/ || exit 1; cp "$P/models/qwen3_8_flash_next/nvidia/ple_layer.py" "$W/ple_layer_patched.py.orig" || exit 1; cp "$P/model_executor/layers/quantization/modelopt.py" "$W/modelopt_patched.py.orig" || exit 1; cp "$P/models/qwen3_8_flash_next/nvidia/ops/qsa.py" "$W/qsa_ops_patched.py.orig" || exit 1; cp "$P/models/qwen3_8_flash_next/nvidia/qsa.py" "$W/qsa_nvidia_patched.py.orig" || exit 1; cp "$P/models/qwen3_8_flash_next/nvidia/mtp.py" "$W/mtp_patched.py.orig" || exit 1; python3 "$W/patch_ple_layer.py" || exit 1; python3 "$W/patch_modelopt_mxfp8.py" || exit 1; python3 "$W/patch_modelopt_fp8_block_moe.py" || exit 1; python3 "$W/patch_qsa_fp8_kv.py" || exit 1; python3 "$W/patch_mtp_draft_vocab.py" || exit 1; cp "$W/ple_layer_patched.py" "$P/models/qwen3_8_flash_next/nvidia/ple_layer.py" || exit 1; cp "$W/modelopt_patched.py" "$P/model_executor/layers/quantization/modelopt.py" || exit 1; cp "$W/qsa_ops_patched.py" "$P/models/qwen3_8_flash_next/nvidia/ops/qsa.py" || exit 1; cp "$W/qsa_nvidia_patched.py" "$P/models/qwen3_8_flash_next/nvidia/qsa.py" || exit 1; cp "$W/mtp_patched.py" "$P/models/qwen3_8_flash_next/nvidia/mtp.py" || exit 1; echo "[qwen38flash] in-container patches applied"'
