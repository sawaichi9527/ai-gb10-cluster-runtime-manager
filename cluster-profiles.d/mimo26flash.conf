#!/usr/bin/env bash
# =====================================================================
# mimo26flash cluster profile — MiMo V2.6 Flash MOPD (vLLM TP2 + DFlash)
# Authoritative profile data; consumed by scripts/cluster-common.sh loader.
#
# Lane lineage: tonyd2wild / Tech2Wild "MiMo-V2.6-Flash-DGX-Spark-Recipe"
# (MIT) — vLLM TP2 + the checkpoint's bundled DFlash drafter on 2x DGX
# Spark (GB10, sm_121). Runtime support is VENDORED at patches/mimo26flash/
# (the recipe's full patched vLLM sources) and bind-mounted read-only over
# the image's copies at container start — no image rebuild. See
# patches/mimo26flash/NOTICE.md. Applied:
#   1. mimo_v2.py            — fused fp8 QKV chunk sharding (ckpt_tp) + fp8 KV
#   2. mimo_v2_omni.py       — SupportsEagle3 marker so DFlash works on the
#                              omni class (needed even for text-only)
#   3. triton_attn_diffkv.py — fp8 (e4m3) DiffKV KV-cache support
#   + dflash-config.fixed.json over /model/dflash/config.json (the upstream
#     release ships a trailing comma -> invalid JSON).
# The recipe's 4th patch (qwen3_dflash.py value-scale) is opt-in and measured
# to give no gain at TP2, so it is NOT applied.
#
# Model: ProCreations/MiMo-V2.6-Flash-MOPD-NVFP4, revision
#   da654d8ed8d0d2acbf0fc5b63df72a7b75a6bb2a (~199 GB on disk, gguf/ not
#   fetched) — a lossless re-quant of XiaomiMiMo/MiMo-V2.6-Flash-MOPD
#   (revision 2479e2d0..., the MXFP4 QAT checkpoint, ~178 GB, still on disk
#   for A/B rollback). It is Xiaomi's MOPD upgrade of ...-Flash-RL (mitigates
#   tool-call repetition); the transcode is of THAT same checkpoint.
#
#   NVFP4 delta vs the MXFP4 lane (this is the whole point of the eval):
#     * quant_method "modelopt" + quant_algo "MIXED_PRECISION", routed experts
#       W4A16_NVFP4 group_size 16 (vLLM resolves it as `modelopt_mixed`; it
#       ships ModelOptNvFp4Config / ModelOptMixedPrecisionConfig and picks its
#       own MoE kernel via select_nvfp4_moe_backend).
#     * experts: U8 weight + F8_E4M3 per-16 block scale + F32 global scale
#       (MXFP4 was U8 weight + U8 E2M0 scale_32).
#     * dense/attention: dequantized to F32 (63 tensors, fp8_to_fp32) and
#       qkv_proj re-laid-out from the checkpoint's TP=4 interleaving to
#       GLOBAL Q/K/V order (51 tensors, qkv_tp_reordered=true). So the MXFP4's
#       ckpt_tp fp8-QKV sharding in patch 01 is DEAD CODE here — qkv_proj is
#       plain F32, not fp8-with-scales. Patches 01 (window/cache_config parts),
#       02 (DFlash on the omni class) and 03 (fp8 DiffKV) are still required.
#     * conversion-report.json says validation_status: "unverified".
#   TP2-only (194 GB of weights will not fit one GB10's 121.69 GiB).
#
# Image: ghcr.io/tonyd2wild/vllm-glm53-flash:sm121-v11-dflash2
#   (community image; vLLM 0.1.dev20051, torch 2.13, CUDA 13, sm_120 kernels).
#   Pulled via the anonymous GHCR mirror ghcr.nju.edu.cn on both nodes (GHCR
#   itself was unusably slow/flaky from this site), then retagged to the
#   ghcr.io name. The mirror's manifest digest was byte-identical to ghcr.io's
#   (verified 2026-10-03), so the image is the same artifact:
#     sha256:4def0ef644cb2e9814136dcffd5e385e21bc594f48f3b292234051904abe85a6
#   IMG_SHA256 pins that manifest digest (verify_profile_image_gate compares
#   RepoDigests, never .Id). The local RepoDigests carries the mirror repo name
#   but the same digest value, which is what the gate matches on.
#
# Cluster-only + exclusive (like deepseek): served on the unified :1234
# OpenAI API as model id "aeon". `gb10 use mimo26flash` frees both nodes'
# single-node runtimes and tears down the live TP2 stack first.
#
# STATUS: NVFP4 eval build. Image on both nodes; NVFP4 weights at
#   $HOME/docker-stacks/models/mimo-v2.6-flash-mopd-nvfp4 (194/194 files +
#   SHA256 spot-check verified on BOTH nodes 2026-10-05), MXFP4 copy kept at
#   $HOME/docker-stacks/models/mimo-v2.6-flash-mopd for rollback (revert
#   BODY_REL below). Multimodal enabled (image/video native; audio via the
#   prebuilt ${STACK_DIR}/pyextra on PYTHONPATH).
# =====================================================================
PROFILE_ID="mimo26flash"
DISPLAY_NAME="MiMo V2.6 Flash MOPD NVFP4 (vLLM TP2 + DFlash, 256K)"
PLACEHOLDER="false"

# Compose is the only launch lane.
LAUNCH_STYLE="compose"
ENGINE="vllm"

# Node-local stack dir (source-named). mimo26flash is cluster-only.
STACK_DIR="${HOME}/docker-stacks/tonyd2wild-vllm-mimo26flash"
COMPOSE_FILE="docker-compose.mimo26flash.yml"

IMAGE="ghcr.io/tonyd2wild/vllm-glm53-flash:sm121-v11-dflash2"
# Manifest digest (RepoDigests) — identical on ghcr.io and the mirror used to
# pull it. Verified on both nodes 2026-10-03.
IMG_SHA256="sha256:4def0ef644cb2e9814136dcffd5e385e21bc594f48f3b292234051904abe85a6"

MODELS_BASE="$HOME/docker-stacks/models"
# NVFP4 W4A16 re-quant of the MOPD checkpoint. Set this back to
# "mimo-v2.6-flash-mopd" to return to the MXFP4 lane (nothing else changes).
BODY_REL="mimo-v2.6-flash-mopd-nvfp4"
# Drafter ships inside the checkpoint at <body>/dflash (no /drafter mount).
DRAF_REL=""

# 256K context / 8-way concurrency / recipe GMU 0.90.
MAXLEN="262144"
NUMSEQ="8"
GMU="0.90"
# BATCHED intentionally unset: the loader omits --max-num-batched-tokens, which
# matches the recipe (it does not pass the flag; vLLM picks its own default).
# ENABLE_CHUNKED_PREFILL / ENABLE_PREFIX_CACHING are likewise left unset so the
# loader emits neither flag and vLLM's own defaults (both on) apply — exactly
# the recipe's launch. Set them explicitly to override.

# Model-specific vLLM settings (from recipe launch/serve.sh).
# QUANTIZATION="none" omits --quantization so vLLM auto-detects it: MXFP4
# resolved to `fp8`(+store mxfp4), NVFP4 resolves to `modelopt_mixed`.
QUANTIZATION="none"
KV_DTYPE="fp8"
MOE_BACKEND="marlin"
LINEAR_BACKEND="auto"
DISABLE_CUSTOM_ALL_REDUCE="false"
GRAPH_MODE="FULL_AND_PIECEWISE"
SHM_SIZE="32g"
HEALTH_TIMEOUT="3600"

# Bundled DFlash drafter: 7 draft tokens, resolved as a concrete local path
# inside the read-only /model mount (vLLM does not resolve a Hub subfolder).
SPEC_CONFIG='{"method":"dflash","model":"/model/dflash","num_speculative_tokens":7}'

REASONING_PARSER="mimo"
TOOL_CALL_PARSER="mimo"
ENABLE_AUTO_TOOL_CHOICE="true"

# Verbatim recipe launch flags the shared builder does not cover.
EXTRA_ARGS=(
  --distributed-executor-backend mp
  --no-async-scheduling
  --generation-config auto
  --override-generation-config '{"repetition_penalty": 1.05}'
  --default-chat-template-kwargs '{"enable_thinking": false}'
  --limit-mm-per-prompt '{"image":16,"video":1,"audio":4}'
)

# Container env from the recipe (offline weights + DeepGEMM off + RoCE/NCCL).
# NCCL_IB_HCA / NCCL_IB_GID_INDEX / NCCL_SOCKET_IFNAME / VLLM_HOST_IP come from
# the shared builder (cluster.env).
EXTRA_ENV=(
  HF_HUB_OFFLINE=1
  TRANSFORMERS_OFFLINE=1
  VLLM_USE_DEEP_GEMM=0
  VLLM_ENGINE_READY_TIMEOUT_S=3600
  TORCH_CUDA_ARCH_LIST=12.1a
  VLLM_CACHE_ROOT=/cache/vllm
  TRITON_CACHE_DIR=/cache/triton
  TP_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME}
  NCCL_NET=IB
  NCCL_IB_DISABLE=0
  NCCL_IB_ROCE_VERSION_NUM=2
  NCCL_IB_ADDR_FAMILY=AF_INET
  NCCL_CROSS_NIC=0
  NCCL_NVLS_ENABLE=0
  NCCL_IB_MERGE_NICS=0
  NCCL_CUMEM_ENABLE=0
  NCCL_IGNORE_CPU_AFFINITY=1
  NCCL_DEBUG=WARN
  TORCH_NCCL_ASYNC_ERROR_HANDLING=1
  # Audio input: the image lacks soundfile/PyAV, so they are prebuilt on each
  # node at ${STACK_DIR}/pyextra and put on PYTHONPATH (recipe setup.sh step 3b).
  PYTHONPATH=/cache/pyextra
)

# Vendored patched vLLM sources bind-mounted over the image's own files, the
# repaired DFlash config over the read-only /model mount, and a lane-isolated
# cache root. The patch dir is staged on BOTH nodes by SYNC_DIRS below.
EXTRA_MOUNTS=(
  -v "${HOME}/.cache/vllm-mimo26flash:/cache/vllm"
  -v "${STACK_DIR}/pyextra:/cache/pyextra:ro"
  -v "${STACK_DIR}/patches/mimo_v2.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/models/mimo_v2.py:ro"
  -v "${STACK_DIR}/patches/mimo_v2_omni.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/models/mimo_v2_omni.py:ro"
  -v "${STACK_DIR}/patches/triton_attn_diffkv.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/attention/backends/triton_attn_diffkv.py:ro"
  -v "${STACK_DIR}/patches/dflash-config.fixed.json:/model/dflash/config.json:ro"
)

# Auto-provision the runtime patch dir on BOTH nodes from the repo source of
# truth (Node1 does not host the repo, and the compose only ships the render).
SYNC_DIRS=(
  "${REPO_DIR}/patches/mimo26flash:${STACK_DIR}/patches"
)

# Lane-isolated per-boot FlashInfer autotune reset (TP2 hard rule: the cache is
# rank-keyed and a leader-authored file deadlocks the two ranks at boot).
AUTOTUNE_CACHE_REL=".cache/vllm-mimo26flash/flashinfer_autotune_cache"
