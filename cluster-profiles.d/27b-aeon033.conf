#!/usr/bin/env bash
# =====================================================================
# 27b cluster candidate — Qwen3.8 27B on aeon-vllm-ultimate 0.33 (A/B lane)
#
# NOT a service. Single-axis campaign: the production 27b profile is copied
# verbatim except for the image generation and the knobs that belonged to 0.29.
# Promote by diffing this file against cluster-profiles.d/27b.conf.
#
# Diff vs cluster-profiles.d/27b.conf:
#   IMAGE           2026-09-18-v0.29.0-omni -> 2026-11-23-v0.33.0-omni-dflash2
#   IMG_SHA256      added (same digest on BOTH nodes: node0 re-attached it with
#                   a no-op `docker pull` after the CX7 transfer, node1 pulled it)
#   EXTRA_ENV       dropped VLLM_USE_V2_MODEL_RUNNER=1 (the V1/V2 pin was removed
#                   upstream long before 0.27.1; 0.33 has no such switch to hold)
#   cache root      own tree (~/.cache/vllm-27b-aeon033-cluster) so the 0.29
#                   lane's autotune/compile cache stays warm for rollback
# Everything else (GMU 0.85, NSPEC 7, TRITON_ATTN, fp8_e4m3 KV, PASS_CONFIG
# fuse_allreduce_rms:false, prefix caching OFF, parsers) is unchanged on purpose:
# those are the TP2 correctness knobs and this campaign does not re-tune them.
# =====================================================================
PROFILE_ID="27b-aeon033"
DISPLAY_NAME="Qwen3.8 27B (aeon 0.33 candidate)"
PLACEHOLDER="false"

LAUNCH_STYLE="compose"

STACK_DIR="${HOME}/docker-stacks/aeon-vllm-ultimate"
COMPOSE_FILE="docker-compose-27b-aeon033-cluster.yml"

HEALTH_TIMEOUT="3600"

IMAGE="ghcr.io/aeon-7/aeon-vllm-ultimate:2026-11-23-v0.33.0-omni-dflash2"
# Manifest digest recorded by `docker image inspect .RepoDigests` on BOTH nodes
# (2026-11-26). No IMG_SHA256_NODE1: unlike the b12x transfer, the CX7-loaded
# node0 image re-attached the registry digest instead of keeping an empty field.
IMG_SHA256="sha256:71c2b82b3b0c97ddca9ef35b279fb745ee0abe29b762a24c8c0771cf930f11ab"

MODELS_BASE="$HOME/docker-stacks/models"
BODY_REL="qwen3.8-27b-aeon-ultimate-uncensored-nvfp4-mixed"
DRAF_REL="qwen3.8-27b-dflash2"

MAXLEN="262144"
NUMSEQ="8"
BATCHED="16384"
GMU="0.85"
NSPEC="7"

QUANTIZATION="none"
KV_DTYPE="fp8_e4m3"
ATTN_BACKEND="TRITON_ATTN"
SPEC_METHOD="dflash"
SPEC_ATTN_BACKEND="TRITON_ATTN"
GRAPH_MODE="FULL_AND_PIECEWISE"
PASS_CONFIG='{"fuse_allreduce_rms":false}'
REASONING_PARSER="qwen3"
TOOL_CALL_PARSER="qwen3_coder"
ENABLE_AUTO_TOOL_CHOICE="true"
ENABLE_CHUNKED_PREFILL="true"
ENABLE_PREFIX_CACHING="false"

EXTRA_ENV=(
  VLLM_CACHE_ROOT=/cache/vllm
  VLLM_ALLREDUCE_USE_FLASHINFER=0
  # S1 cell (2026-11-26): tried VLLM_USE_FLASHINFER_SAMPLER=1 to recover the
  # 0.33 decode regression -> NO effect (C1 35.6 vs 32.5, C8 137.6 vs 140.3,
  # C4 99.4 vs 103.0; all inside this lane's noise). Reverted to the measured
  # baseline value so the A/B stays single-variable.
  VLLM_USE_FLASHINFER_SAMPLER=0
)
EXTRA_MOUNTS=(
  -v "${HOME}/.cache/vllm-27b-aeon033-cluster:/cache/vllm"
)

AUTOTUNE_CACHE_REL=".cache/vllm-27b-aeon033-cluster/flashinfer_autotune_cache"
