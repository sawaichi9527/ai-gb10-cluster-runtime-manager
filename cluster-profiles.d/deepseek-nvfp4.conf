#!/usr/bin/env bash
# =====================================================================
# deepseek-nvfp4 cluster profile — ARCHIVED (retired as mainline 2026-09-07)
# NVFP4 AEON lane (r2 / DSpark K5, topk256 image).
#
# ARCHIVE RECORD: this was the live `deepseek` profile captured verbatim
# from Node0 immediately before the fp8 DSpark mainline took its place.
# It remains ONLY as a record + safe-fail placeholder: PLACEHOLDER=true,
# so `gb10 use deepseek-nvfp4` prints "not deployed yet" and never
# touches a stack. The NVFP4 weights on both nodes are kept on disk
# (deepseek-v4-flash-0731-nvfp4/) for any future re-bring-up after a
# mature AEON image arrives — do NOT delete them.
# Reason for retirement: NVFP4 lane measured ~3.27% draft acceptance /
# ~11.6 tok/s; official fp8 + Anemll dspark-vllm-gx10 (new `deepseek`
# mainline) measured ~77% acceptance / ~75 tok/s on the same hardware.
# =====================================================================
PROFILE_ID="deepseek-nvfp4"
DISPLAY_NAME="DeepSeek V4 Flash 0731 (NVFP4 AEON, ARCHIVED 2026-09-07)"
PLACEHOLDER="true"

# Per-profile image (overrides the cluster-global tp2.env IMG fallback).
IMAGE="ghcr.io/aeon-7/aeon-vllm-ultimate:2026-09-06-v0.27.1-omni-ds4flash0731-r1-topk256v2"

# Model relative path under $MODELS_BASE (resolved by the loader).
BODY_REL="deepseek-v4-flash-0731-nvfp4"
# No external drafter: DSpark draft is embedded in the target checkpoint.
DRAF_REL=""

# Context / concurrency / GMU (frozen r1 64K baseline; unchanged).
MAXLEN="65536"
NUMSEQ="4"
BATCHED="4096"
GMU="0.80"

# Model-specific vLLM settings (profile-owned).
KV_DTYPE="fp8_ds_mla"
GRAPH_MODE="PIECEWISE"
# r2: DSpark K5 on the same checkpoint (embedded draft, no /drafter).
SPEC_METHOD="dspark"
NSPEC="5"
ENABLE_CHUNKED_PREFILL="true"
ENABLE_PREFIX_CACHING="false"