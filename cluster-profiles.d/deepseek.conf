#!/usr/bin/env bash
# =====================================================================
# deepseek cluster profile — DeepSeek V4 Flash 0731 Dspark-Ablit (TP2)
# on eugr/spark-vllm-b12x — Authoritative profile data; consumed by
# scripts/cluster-common.sh loader.
#
# STATUS: live-capable (PLACEHOLDER=false). PROMOTED RECIPE
# (2026-10-09): eugr/spark-vllm-b12x + drowzeys 0731 Dspark-Abliterated,
# promoted from the deepseek-b12x candidate lane after the
# recipe-succession A/B passed its gate on D0 — decode Sigma +3.4%
# (8/8 cells positive), acceptance +2.3pp, cold prefill +16..18%,
# prefix-hit correctness PASS WITHOUT hotfixes, all soak gates PASS:
#   docs/DEEPSEEK_B12X_RECIPE_AB_2026-10-09.md
#   docs/evidence/deepseek-b12x-recipe-ab-2026-10-09/{ab-D0.txt,d0-cycle-output.txt}
#
# WHY (succession rationale): the previous recipe pinned
# ghcr.io/anemll/dspark-vllm-gx10:0.1.1 (believed unmaintained upstream)
# + the official checkpoint + a startup wrapper installing the SWA-prefix
# hotfix (fail-closed). The eugr image is a maintained nightly-CI runtime
# upstream runs this 0731 model on (recipes/deepseek-v4-flash-0731.yaml,
# mods: []) — no CMD_WRAPPER, no SYNC_DIRS, no patches mount at all.
#
# BACKUP SOLUTION (user decision 2026-10-09): the previous Anemll
# recipe is archived byte-identical at
#   cluster-profiles.d/_backup/deepseek-anemll.conf
# (SHA256 3147b4e99e6b040f2318b865666132f79d4ed72f9f475db0f0c48eaee78f0562)
# with its runtime hotfix kept in-repo at patches/dspark-vision/
# (hotfix-vllm-dspark-swa-prefix.py, MIT, see NOTICE.md) — restore
# instructions in _backup/README.md. It is NOT a deployed lane; nothing
# here references it at runtime.
#
# PROVENANCE of the recipe below:
#   - github.com/eugr/spark-vllm-docker
#     recipes/deepseek-v4-flash-0731.yaml (fetched 2026-10-09):
#     kv-cache-dtype fp8, b12x kernel trio, dspark probabilistic B12X
#     spec decode, block 256, batched 8192, num_seqs 8, GMU 0.85,
#     prefix caching ON, mods: [].
#   - cluster contract (dual-node digest pins, seccomp=unconfined for
#     the b12x loader io_uring bounce path, HEALTH_TIMEOUT 3600 for
#     B12X JIT) from cluster-profiles.d/deepseek-nvfp4.conf.
#
# DELIBERATE DEVIATIONS from upstream verbatim:
#   - CUDAGRAPH_CAPTURE 64 (not 48): miaai formula seqs*(k+1)=8*8 with
#     the k=7 production draft length — upstream's 48 assumes THEIR
#     k=5, and the vision succession B0 proved verbatim capture loses
#     C7/C8 to capture-range fallback. D0 captured [1..64], no deficit.
#   - num_speculative_tokens 7 (upstream ships 5): the production E5
#     contract — the README decode/acceptance baseline is k=7, so
#     acceptance stays comparable across the succession.
#   - kept production-era extras NOT in the upstream recipe:
#     none (the old --async-scheduling / --generation-config vllm /
#     --enable-flashinfer-autotune were dropped — Anemll-lane extras,
#     deepseek-nvfp4 precedent).
#
# MODEL: $HOME/docker-stacks/models/deepseek-v4-flash-0731-dspark-ablit
#   (166.9 GB, 48 shards; drowzeys/keys-DeepSeekV4-Flash-GA-0731-Dspark-
#   Abliterated-Anchored-Tensors, HF sha a1e6937…). ABLIT_META: 26
#   tensors edited (layers 10-35 wo_b, layer-range lambda 3.5);
#   DSPARK_ANCHOR_MANIFEST: layers 36-42 restored hash-identical to
#   official stock and ALL MTP/draft tensors unchanged -> b12x loader
#   contract holds (D0 loaded --load-format b12x, no fallback). Verified
#   against the HF file list (48 shard sha256 match) and mirrored to
#   BOTH nodes byte-identical (2026-10-09).
#
# MEASURED (2026-10-09 D0; README = old-recipe E5 record):
#   decode Sigma 693.3 vs 670.7 (+3.4%, 8/8 cells positive);
#   accept 33.4% vs 31.1% (+2.3pp); cold prefill 131K 2174 and
#   200K 2043 vs 1868.8 / 1747.3 (+16..17%), 261K 1947 vs 1648.2
#   (+18%), 262K near-limit OK; prefix-cache hit 32K 38.5x with
#   byte-identical completions (NO hotfix needed in this fork); KV
#   pool 407,775 tokens (old recipe nvfp4_ds_mla 405,179); soak
#   3x3 completeness 3/3, garble 3/3, /health 200.
#   NOTE: anemll-era E5 history (probabilistic + SWA-prefix hotfix,
#   docs/DEEPSEEK_TUNE_AB_2026-10-06.md) belongs to the BACKUP recipe
#   above — those knobs are superseded by the image swap.
# =====================================================================
PROFILE_ID="deepseek"
DISPLAY_NAME="DeepSeek V4 Flash 0731 Dspark-Ablit (eugr b12x, 256K)"
PLACEHOLDER="false"

LAUNCH_STYLE="compose"

# Node-local stack dir (image-named + lane suffix; the old Anemll dir
# anemll-dspark-vllm-gx10 is retired — its compose file is stale on
# both nodes and safe to delete; the recipe is re-renderable from the
# archived conf).
STACK_DIR="${HOME}/docker-stacks/eugr-spark-vllm-b12x-deepseek"
COMPOSE_FILE="docker-compose.deepseek.yml"
ENGINE="vllm"

# Maintained upstream runtime (DockerHub nightly CI; digests advance!)
# — byte-identical pins to deepseek-nvfp4 / deepseek-vision (see those
# headers for the per-node digest rationale; re-pull / re-transfer =>
# re-pin both).
IMAGE="eugr/spark-vllm-b12x:latest"
IMG_SHA256="sha256:036c307678dad66adbbb5a627ec8d3a0d8f9bbf8be4a679e6e441a0b2e1ab2c3"
IMG_SHA256_NODE1="sha256:dc0e9faa61d4d4133e07ec81536107b99ab741c49f198b5d4fafbc8f2466b2eb"

# Abliterated 0731 checkpoint (same-model DSpark draft in-checkpoint:
# no /drafter mount).
MODELS_BASE="$HOME/docker-stacks/models"
BODY_REL="deepseek-v4-flash-0731-dspark-ablit"
DRAF_REL=""

# 256K ctx / 8-way (production contract kept); batched + GMU per eugr
# family standard (D0: no binding at <=8 seqs).
MAXLEN="262144"
NUMSEQ="8"
BATCHED="8192"
GMU="0.85"

# config.json quantization_config: quant_method fp8, weight_block_size
# [128,128], scale_fmt ue8m0 (official layout) — omit the flag,
# auto-detect (D0: engine reported quantization=deepseek_v4_fp8).
QUANTIZATION="none"
# fp8 KV = only option for DeepSeekV4 in this image (nvfp4_ds_mla is
# structurally impossible: deepseek-nvfp4 A/B cell B, 2026-10-08 —
# three independent gates; do not retry without an upstream change).
# Measured pool 407,775 tokens > old recipe's nvfp4_ds_mla 405,179.
KV_DTYPE="fp8"

# B12X kernel trio (eugr recipe, capitalisation as upstream emits it).
ATTN_BACKEND="B12X"
LINEAR_BACKEND="b12x"
MOE_BACKEND="b12x"
# Recipe compilation config verbatim (custom_ops all -> B12X op dispatch).
COMPILATION_JSON='{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}'
CUDAGRAPH_CAPTURE="64"                  # promoted value (see header DELIBERATE
                                        # DEVIATIONS: formula 8*(7+1); D0
                                        # captured [1..64], no C7/C8 deficit)
ENABLE_CHUNKED_PREFILL="true"
# Upstream recipe ON; gated in the succession A/B by the prefix-hit
# probe: PASS (38.5x, byte-identical completions, no hotfix needed —
# the SWA-prefix bug did not reproduce in this fork).
ENABLE_PREFIX_CACHING="true"
# eugr recipe keeps custom all-reduce (loader default would disable it).
DISABLE_CUSTOM_ALL_REDUCE="false"
SHM_SIZE="64g"

# b12x loader bounce path needs io_uring (blocked by default seccomp) —
# same probe result and remedy as deepseek-nvfp4 (2026-10-07).
SECURITY_OPT=("seccomp=unconfined")

# DSpark same-model draft in-checkpoint (k=7 = previous recipe's E5
# value, so acceptance numbers stay comparable across succession;
# upstream recipe ships 5).
SPEC_CONFIG='{"method":"dspark","num_speculative_tokens":7,"draft_sample_method":"probabilistic","attention_backend":"B12X"}'

REASONING_PARSER="deepseek_v4"
TOOL_CALL_PARSER="deepseek_v4"
ENABLE_AUTO_TOOL_CHOICE="true"

# Upstream command verbatim family (nvfp4-lane template) +
# --load-format b12x (upstream verbatim; D0 loaded the draft head with
# no strided refusal — the anchored checkpoint keeps official layout).
EXTRA_ARGS=(
  --load-format b12x
  --block-size 256
  --tokenizer-mode deepseek_v4
  --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}'
  --default-chat-template-kwargs.thinking=true
  --default-chat-template-kwargs.reasoning_effort=high
  --distributed-executor-backend mp
)

# Container env: eugr 0731 recipe block (verbatim) + offline/lane
# cache + our RoCE/NCCL cluster contract (builder adds VLLM_HOST_IP /
# NCCL_SOCKET_IFNAME / GLOO_SOCKET_IFNAME / NCCL_IB_HCA /
# NCCL_IB_GID_INDEX / PYTORCH_CUDA_ALLOC_CONF). Anemll-image-only env
# deliberately absent — that code does not exist in this image.
EXTRA_ENV=(
  # ---- eugr recipes/deepseek-v4-flash-0731.yaml env block ----
  CUTE_DSL_ARCH=sm_121a
  VLLM_USE_AOT_COMPILE=1
  VLLM_USE_BREAKABLE_CUDAGRAPH=0
  VLLM_USE_MEGA_AOT_ARTIFACT=1
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN=1
  VLLM_USE_FLASHINFER_SAMPLER=1
  VLLM_USE_B12X_WO_PROJECTION=1
  VLLM_USE_B12X_MHC=1
  VLLM_USE_B12X_FP8_GEMM=1
  VLLM_USE_B12X_MOE=1
  VLLM_USE_B12X_SPARSE_INDEXER=1
  VLLM_USE_V2_MODEL_RUNNER=1
  VLLM_MOE_SKIP_PADDING=0
  B12X_MLA_SM120_UNIFIED=1
  B12X_MOE_FORCE_A8=1
  # ---- offline + lane-local cache root ----
  HF_HUB_OFFLINE=1
  TRANSFORMERS_OFFLINE=1
  VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
  VLLM_CACHE_ROOT=/cache/vllm
  FLASHINFER_WORKSPACE_BASE=/cache/vllm/flashinfer
  # ---- RoCE/NCCL cluster contract (same as every deepseek lane) ----
  TP_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME}
  NCCL_NET=IB
  NCCL_IB_DISABLE=0
  NCCL_IB_ROCE_VERSION_NUM=2
  NCCL_IB_ADDR_FAMILY=AF_INET
  NCCL_IB_TIMEOUT=22
  NCCL_IB_RETRY_CNT=7
  NCCL_CROSS_NIC=1
  NCCL_CUMEM_ENABLE=0
  NCCL_IGNORE_CPU_AFFINITY=1
  NCCL_NVLS_ENABLE=0
)

# Lane-isolated JIT/compile cache root — the SAME root the succession
# A/B boots used (warm, proven; name marks the b12x runtime class and
# keeps it apart from the archived Anemll lane's cache artifacts).
# No CMD_WRAPPER, no SYNC_DIRS: this recipe needs no patches.
EXTRA_MOUNTS=(
  -v "${HOME}/.cache/vllm-deepseek-b12x:/cache/vllm"
)

# Per-boot FlashInfer autotune reset follows this (see cluster-common.sh).
AUTOTUNE_CACHE_REL=".cache/vllm-deepseek-b12x/flashinfer_autotune_cache"

# B12X kernels JIT-compile on first use (build metadata, not prebuilt
# CUDA) -> first cold boot can exceed the 2400s default (27b precedent).
HEALTH_TIMEOUT="3600"
