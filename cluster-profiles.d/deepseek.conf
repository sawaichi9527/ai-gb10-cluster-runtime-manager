#!/usr/bin/env bash
# =====================================================================
# deepseek cluster profile — DeepSeek V4 Flash 0731 (r2 / DSpark K5)
# Authoritative profile data; consumed by scripts/tp2-common.sh loader.
# r2 = config-only DSpark bring-up on the FROZEN r1 image (no rebuild,
# no vLLM/FlashInfer patch). All r1 64K baseline values stay frozen;
# ONLY speculative decode is switched on: method=dspark, K=5 (==
# dspark_block_size, the block drafter minimum). Embedded draft: the
# MTP/DSpark heads ship inside the target checkpoint, so DRAF_REL stays
# "" (no /drafter mount); tp2-common.sh emits the model-less form of
# --speculative-config for that case.
# =====================================================================
PROFILE_ID="deepseek"
DISPLAY_NAME="DeepSeek V4 Flash 0731 (r2 DSpark K5)"
PLACEHOLDER="false"

# Per-profile image (overrides the cluster-global tp2.env IMG fallback).
IMAGE="ghcr.io/aeon-7/aeon-vllm-ultimate:2026-09-04-v0.27.1-omni-ds4flash0731-r1"

# Model relative path under $MODELS_BASE (resolved by the loader).
BODY_REL="deepseek-v4-flash-0731-nvfp4"
# No external drafter: DSpark draft is embedded in the target checkpoint.
DRAF_REL=""

# Context / concurrency / GMU (frozen r1 64K baseline; unchanged).
MAXLEN="65536"
NUMSEQ="4"
BATCHED="4096"
GMU="0.80"

# Model-specific vLLM settings (profile-owned).
KV_DTYPE="fp8_ds_mla"
GRAPH_MODE="PIECEWISE"
# r2: DSpark K5 on the same checkpoint (embedded draft, no /drafter).
SPEC_METHOD="dspark"
NSPEC="5"
ENABLE_CHUNKED_PREFILL="true"
ENABLE_PREFIX_CACHING="false"
