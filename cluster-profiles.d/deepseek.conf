#!/usr/bin/env bash
# =====================================================================
# deepseek cluster profile — DeepSeek V4 Flash 0731 (fp8 DSpark mainline)
# Authoritative profile data; consumed by scripts/cluster-common.sh loader.
#
# MAINLINE (since 2026-09-07): official deepseek-ai fp8 checkpoint +
# public Anemll runtime (MiaAI-Lab/Weschera lineage, config.drop-256KB +
# dspark7). Retuned from the gate-passed 40K reference lane to the
# production contract: 256KB context + DSpark + 8 concurrent streams.
# The NVFP4 AEON lane was retired/archived to ~/_archieve/cluster-profiles.d/deepseek-nvfp4.conf
# (placeholder; weights kept on disk).
#
# Image gate: ghcr.io/anemll/dspark-vllm-gx10:0.1.1 =>
#   manifest   sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8
#   node0 classic-store inspect .Id (config digest): 3430d6614a8e2925f34d059af6caf05aff42387326db4d05639a60f10f2654d8
# Verified 2026-09-19 on both nodes: RepoDigests[0] == a8394849... on node0
# (overlay2/classic store) and node1 (containerd image store). The containerd
# store reports .Id == manifest digest, the classic store .Id == config digest,
# so cross-node comparison MUST use .RepoDigests (manifest), never .Id.
# IMG_SHA256 below is consumed by scripts/cluster-common.sh verify_profile_image_gate
# (fail-fast preflight in scripts/cluster-up).
# Official checkpoint pinned to revision 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
# (Weschera manifest SHA256SUMS gate:
#  9ab9b79d95289707e7ec23227bf49a142c0174b6334a1fbe5fedd464f7913871).
# Serves the unified :1234 OpenAI API with the shared VLLM_API_KEY
# (served model id "aeon"; max_model_len 262144).
#
# 2026-10-06 E5 PROMOTION (same image, profile-side only; evidence in
# docs/DEEPSEEK_TUNE_AB_2026-10-06.md):
#   + draft_sample_method greedy -> probabilistic   (spec-draft proposals)
#   + prefix caching ON + hotfix-vllm-dspark-swa-prefix.py + retention 4096
#   Measured vs the pre-promotion baseline on scripts/bench-ab-deepseek.sh:
#     decode C1..C8 median sum  594.2 -> 655.5 tok/s  (+10.3 %, 6/8 cells >+10 %)
#     draft acceptance          26.9 % -> 32.1 %      (+4.4 pp of per-C deltas,
#                                                     8/8 non-negative)
#     warm prefix prefill       8.5x (2105 -> 17989 tok/s)
#     cold prefill              -0.8 / -1.9 / -1.0 %  (flat)
#     boot / graph pool / KV    unchanged
#   Gates passed: compose-verify both ranks, gb10 smoke, 3x3 completeness,
#   261K + 262K long-context, garble soak 3/3, /health 200.
#   Deliberately NOT adopted (measured inside the noise floor, rejected):
#     E1 CUDAGRAPH_CAPTURE 8 -> 128   (+2.1 %, but +16 s boot + 1.9 GiB)
#     E4 VLLM_USE_BREAKABLE_CUDAGRAPH=0 (-1.5 %)
#   NOTE: the dspark-swa-prefix hotfix is REQUIRED while prefix caching is on
#   — without it a cache hit leaves the DSpark draft's 128-token sliding window
#   unpopulated and the verifier accepts a truncated answer.
# =====================================================================
PROFILE_ID="deepseek"
DISPLAY_NAME="DeepSeek V4 Flash 0731 (fp8 DSpark mainline, 256K)"
PLACEHOLDER="false"

# Launch mechanism: docker (default, 27b/35b) vs compose (deepseek lanes).
# cluster-up branches on this; compose config is RENDERED per launch from
# the same profile data as the docker-run path (zero runtime drift).
LAUNCH_STYLE="compose"

# Node-local stack dir (image-named). deepseek is cluster-only.
STACK_DIR="${HOME}/docker-stacks/anemll-dspark-vllm-gx10"
COMPOSE_FILE="docker-compose.deepseek.yml"

# Per-profile image (Weschera-pinned public runtime).
IMAGE="ghcr.io/anemll/dspark-vllm-gx10:0.1.1"
# Registry manifest digest gate (see header); fail-fast in cluster-up.
IMG_SHA256="sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8"

# Official checkpoint (same-model DSpark draft: no /drafter mount).
MODELS_BASE="$HOME/docker-stacks/models"
BODY_REL="deepseek-v4-flash-0731-official"
DRAF_REL=""

# 256KB context / 8-way concurrency / GMU (28B fp8 body; 8-way matches 27b).
MAXLEN="262144"
NUMSEQ="8"
BATCHED="16384"
GMU="0.80"

# Model-specific vLLM settings (profile-owned).
QUANTIZATION="none"
KV_DTYPE="nvfp4_ds_mla"
MOE_BACKEND="flashinfer_b12x"
GRAPH_MODE="FULL_AND_PIECEWISE"
CUDAGRAPH_CAPTURE="8"
ENABLE_CHUNKED_PREFILL="true"
# 2026-10-06 E5: on (see header). Requires CMD_WRAPPER's swa-prefix hotfix below.
ENABLE_PREFIX_CACHING="true"
DISABLE_CUSTOM_ALL_REDUCE="false"
SHM_SIZE="64g"

# DSpark same-model draft (7 probabilistic since the 2026-10-06 E5 promotion;
# was greedy). Weschera contract.
SPEC_CONFIG='{"method":"dspark","num_speculative_tokens":7,"draft_sample_method":"probabilistic"}'
# OpenAI tools: image vLLM 0.25.2.dev0 registry maps "deepseek_v4" -> deepseekv4_engine_tool_parser
ENABLE_AUTO_TOOL_CHOICE="true"
TOOL_CALL_PARSER="deepseek_v4"

# 2026-10-06 E5: in-container pre-serve hook. Applies ONLY the SWA-prefix
# hotfix (opt-in port of Anemll/dspark-vllm-gx10#2) — mandatory while prefix
# caching is on. Fail-closed: a failed patch aborts the container start rather
# than serving with a degenerate draft. The patch dir is staged on BOTH nodes
# by SYNC_DIRS (node1 does not host the repo) and read-only mounted below.
CMD_WRAPPER='python3 /opt/dspark-patches/hotfix-vllm-dspark-swa-prefix.py || exit 1'

# Verbatim vLLM extras from launch_rank.sh (serving-critical subset).
EXTRA_ARGS=(
  --async-scheduling
  --tokenizer-mode deepseek_v4
  --generation-config vllm
  --enable-flashinfer-autotune
  --distributed-executor-backend mp
)

# Container env from launch_rank.sh (Anemll runtime + RoCE/NCCL contract).
EXTRA_ENV=(
  HF_HUB_OFFLINE=1
  TRANSFORMERS_OFFLINE=1
  VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB=256
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0
  VLLM_PREFIX_CACHE_RETENTION_INTERVAL=4096
  ENABLE_VLLM_GB10_PATCH=0
  GB10_HYBRID_NVFP4_M_THRESHOLD=128
  VLLM_USE_FLASHINFER_SAMPLER=1
  VLLM_USE_B12X_MOE=1
  TORCH_CUDA_ARCH_LIST=12.1a
  FLASHINFER_CUDA_ARCH_LIST=12.1a
  CUTE_DSL_ARCH=sm_121a
  FLASHINFER_DISABLE_VERSION_CHECK=1
  TILELANG_CLEANUP_TEMP_FILES=1
  DG_JIT_USE_NVRTC=0
  DG_JIT_NVCC_COMPILER=/usr/local/cuda/bin/nvcc
  VLLM_CACHE_ROOT=/cache/vllm
  FLASHINFER_WORKSPACE_BASE=/cache/vllm/flashinfer
  CUDA_HOME=/usr/local/cuda
  CUDA_PATH=/usr/local/cuda
  CUDAtoolkit_ROOT=/usr/local/cuda
  TP_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME}
  NCCL_NET=IB
  NCCL_IB_DISABLE=0
  NCCL_IB_ROCE_VERSION_NUM=2
  NCCL_IB_ADDR_FAMILY=AF_INET
  NCCL_IB_TIMEOUT=22
  NCCL_IB_RETRY_CNT=7
  NCCL_CROSS_NIC=1
  NCCL_CUMEM_ENABLE=0
  NCCL_IGNORE_CPU_AFFINITY=1
  NCCL_NVLS_ENABLE=0
)

# Lane-isolated JIT/compile cache root (persists across boots; ${HOME} resolves
# per node). deepseek is cluster-only, so no -cluster suffix.
# The second mount is the 2026-10-06 E5 addition: the SWA-prefix hotfix dir
# that CMD_WRAPPER runs from (read-only).
EXTRA_MOUNTS=(
  -v "${HOME}/.cache/vllm-deepseek:/cache/vllm"
  -v "${STACK_DIR}/patches:/opt/dspark-patches:ro"
)

# Per-boot FlashInfer autotune reset follows this (see cluster-common.sh).
AUTOTUNE_CACHE_REL=".cache/vllm-deepseek/flashinfer_autotune_cache"

# 2026-10-06 E5: auto-provision the hotfix dir on BOTH nodes before launch
# (cluster-up SYNC_DIRS hook). Node1 does not host the repo, and only the
# rendered compose ships over, so any bind-mount source must be staged there
# too. SRC is read on Node0; DEST is the same absolute path on both nodes.
# Repo source of truth: patches/dspark-vision/ (the vision lane stages the
# identical directory to its own STACK_DIR).
SYNC_DIRS=(
  "${REPO_DIR}/patches/dspark-vision:${STACK_DIR}/patches"
)
