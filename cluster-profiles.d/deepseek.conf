#!/usr/bin/env bash
# =====================================================================
# deepseek cluster profile — DeepSeek V4 Flash 0731 (experimental r1)
# Authoritative profile data; consumed by scripts/tp2-common.sh loader.
# Frozen r1 image (built 2026-09-05): no drafter, no speculative decode.
# FP8 KV baseline + PIECEWISE graph + 64K context (DSpark off this round).
# =====================================================================
PROFILE_ID="deepseek"
DISPLAY_NAME="DeepSeek V4 Flash 0731"
PLACEHOLDER="false"

# Per-profile image (overrides the cluster-global tp2.env IMG fallback).
IMAGE="ghcr.io/aeon-7/aeon-vllm-ultimate:2026-09-04-v0.27.1-omni-ds4flash0731-r1"

# Model relative path under $MODELS_BASE (resolved by the loader).
BODY_REL="deepseek-v4-flash-0731-nvfp4"
# No drafter: DRAF_REL "" => no /drafter mount, no speculative decode.
DRAF_REL=""

# Context / concurrency / GMU (64K correctness bring-up; DSpark off).
MAXLEN="65536"
NUMSEQ="4"
BATCHED="4096"
GMU="0.80"

# Model-specific vLLM settings (profile-owned).
KV_DTYPE="fp8_ds_mla"
GRAPH_MODE="PIECEWISE"
SPEC_METHOD="none"
ENABLE_CHUNKED_PREFILL="true"
ENABLE_PREFIX_CACHING="false"
