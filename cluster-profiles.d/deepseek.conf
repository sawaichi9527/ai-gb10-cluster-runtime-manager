#!/usr/bin/env bash
# =====================================================================
# deepseek cluster profile — DeepSeek V4 Flash 0731 (fp8 DSpark mainline)
# Authoritative profile data; consumed by scripts/tp2-common.sh loader.
#
# MAINLINE (since 2026-09-07): official deepseek-ai fp8 checkpoint +
# public Anemll runtime (MiaAI-Lab/Weschera lineage, config.drop-256KB +
# dspark7). Retuned from the gate-passed 40K reference lane to the
# production contract: 256KB context + DSpark + 8 concurrent streams.
# The NVFP4 AEON lane was retired to cluster-profiles.d/deepseek-nvfp4.conf
# (archive-only placeholder; weights + images removed from nodes 2026-09-07).
#
# Image gate: ghcr.io/anemll/dspark-vllm-gx10:0.1.1 =>
#   sha256:3430d6614a8e2925f34d059af6caf05aff42387326db4d05639a60f10f2654d8
# Official checkpoint pinned to revision 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
# (Weschera manifest SHA256SUMS gate:
#  9ab9b79d95289707e7ec23227bf49a142c0174b6334a1fbe5fedd464f7913871).
# Serves the unified :1234 OpenAI API with the shared VLLM_API_KEY
# (served model id "aeon"; max_model_len 262144).
# =====================================================================
PROFILE_ID="deepseek"
DISPLAY_NAME="DeepSeek V4 Flash 0731 (fp8 DSpark mainline, 256K)"
PLACEHOLDER="false"

# Per-profile image (Weschera-pinned public runtime).
IMAGE="ghcr.io/anemll/dspark-vllm-gx10:0.1.1"

# Official checkpoint (same-model DSpark draft: no /drafter mount).
BODY_REL="deepseek-v4-flash-0731-official"
DRAF_REL=""

# 256KB context / 8-way concurrency / GMU (28B fp8 body; 8-way matches 27b).
MAXLEN="262144"
NUMSEQ="8"
BATCHED="16384"
GMU="0.80"

# Model-specific vLLM settings (profile-owned).
QUANTIZATION="none"
KV_DTYPE="nvfp4_ds_mla"
MOE_BACKEND="flashinfer_b12x"
GRAPH_MODE="FULL_AND_PIECEWISE"
CUDAGRAPH_CAPTURE="8"
ENABLE_CHUNKED_PREFILL="true"
ENABLE_PREFIX_CACHING="false"
DISABLE_CUSTOM_ALL_REDUCE="false"
SHM_SIZE="64g"

# DSpark same-model draft (7 greedy), Weschera contract.
SPEC_CONFIG='{"method":"dspark","num_speculative_tokens":7,"draft_sample_method":"greedy"}'

# Verbatim vLLM extras from launch_rank.sh (serving-critical subset).
EXTRA_ARGS=(
  --async-scheduling
  --tokenizer-mode deepseek_v4
  --generation-config vllm
  --enable-flashinfer-autotune
  --distributed-executor-backend mp
)

# Container env from launch_rank.sh (Anemll runtime + RoCE/NCCL contract).
EXTRA_ENV=(
  HF_HUB_OFFLINE=1
  TRANSFORMERS_OFFLINE=1
  VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB=256
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0
  ENABLE_VLLM_GB10_PATCH=0
  GB10_HYBRID_NVFP4_M_THRESHOLD=128
  VLLM_USE_FLASHINFER_SAMPLER=1
  VLLM_USE_B12X_MOE=1
  TORCH_CUDA_ARCH_LIST=12.1a
  FLASHINFER_CUDA_ARCH_LIST=12.1a
  CUTE_DSL_ARCH=sm_121a
  FLASHINFER_DISABLE_VERSION_CHECK=1
  TILELANG_CLEANUP_TEMP_FILES=1
  DG_JIT_USE_NVRTC=0
  DG_JIT_NVCC_COMPILER=/usr/local/cuda/bin/nvcc
  VLLM_CACHE_ROOT=/cache/huggingface/vllm-cache
  FLASHINFER_WORKSPACE_BASE=/cache/huggingface/flashinfer
  CUDA_HOME=/usr/local/cuda
  CUDA_PATH=/usr/local/cuda
  CUDAtoolkit_ROOT=/usr/local/cuda
  TP_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME}
  NCCL_NET=IB
  NCCL_IB_DISABLE=0
  NCCL_IB_ROCE_VERSION_NUM=2
  NCCL_IB_ADDR_FAMILY=AF_INET
  NCCL_IB_TIMEOUT=22
  NCCL_IB_RETRY_CNT=7
  NCCL_CROSS_NIC=1
  NCCL_CUMEM_ENABLE=0
  NCCL_IGNORE_CPU_AFFINITY=1
  NCCL_NVLS_ENABLE=0
)

# JIT/compile caches (persist across boots; ${HOME} resolves per node).
EXTRA_MOUNTS=(
  -v "${HOME}/.cache/huggingface:/cache/huggingface"
)