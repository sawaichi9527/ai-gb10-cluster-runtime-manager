# =====================================================================
# deepseek-ref cluster profile — REFERENCE LANE (differential study)
# =====================================================================
# Public known-good recipe: Weschera/DeepSeek-V4-Flash-0731-DSpark-2x-DGX-Spark
# (MiaAI-Lab + Anemll/dspark-vllm-gx10 lineage), speed-gate profile
# (config.40k-speed.example.env, MODE=dspark7). Official deepseek-ai
# checkpoint pinned to revision 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
# (Weschera manifest SHA256SUMS gate:
#  9ab9b79d95289707e7ec23227bf49a142c0174b6334a1fbe5fedd464f7913871).
# Image gate: ghcr.io/anemll/dspark-vllm-gx10:0.1.1 =>
#   sha256:3430d6614a8e2925f34d059af6caf05aff42387326db4d05639a60f10f2654d8
#
# The AEON lane (deepseek.conf) is UNTOUCHED. Both lanes are in the
# exclusive llm group: switching via gb10 use/start frees the other.
# Serves on the unified :1234 API with the shared VLLM_API_KEY.
# =====================================================================
PROFILE_ID="deepseek-ref"
DISPLAY_NAME="DeepSeek V4 Flash 0731 (reference lane - Weschera/Anemll)"
PLACEHOLDER="false"

# Per-profile image (Weschera-pinned public runtime).
IMAGE="ghcr.io/anemll/dspark-vllm-gx10:0.1.1"

# Official checkpoint (same-model DSpark draft: no /drafter mount).
BODY_REL="deepseek-v4-flash-0731-official"
DRAF_REL=""

# Weschera 40K speed contract.
MAXLEN="40000"
NUMSEQ="1"
BATCHED="8192"
GMU="0.80"

# Model-specific vLLM settings (profile-owned).
QUANTIZATION="none"
KV_DTYPE="nvfp4_ds_mla"
MOE_BACKEND="flashinfer_b12x"
GRAPH_MODE="FULL_AND_PIECEWISE"
CUDAGRAPH_CAPTURE="8"
ENABLE_CHUNKED_PREFILL="true"
ENABLE_PREFIX_CACHING="false"
DISABLE_CUSTOM_ALL_REDUCE="false"
SHM_SIZE="64g"

# Weschera dspark7-greedy contract (same-model draft, no model=/drafter).
SPEC_CONFIG='{"method":"dspark","num_speculative_tokens":7,"draft_sample_method":"greedy"}'

# Verbatim vLLM extras from launch_rank.sh (serving-critical subset).
EXTRA_ARGS=(
  --async-scheduling
  --tokenizer-mode deepseek_v4
  --generation-config vllm
  --enable-flashinfer-autotune
  --distributed-executor-backend mp
)

# Container env from launch_rank.sh (Anemll runtime + RoCE/NCCL contract).
EXTRA_ENV=(
  HF_HUB_OFFLINE=1
  TRANSFORMERS_OFFLINE=1
  VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB=256
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0
  ENABLE_VLLM_GB10_PATCH=0
  GB10_HYBRID_NVFP4_M_THRESHOLD=128
  VLLM_USE_FLASHINFER_SAMPLER=1
  VLLM_USE_B12X_MOE=1
  TORCH_CUDA_ARCH_LIST=12.1a
  FLASHINFER_CUDA_ARCH_LIST=12.1a
  CUTE_DSL_ARCH=sm_121a
  FLASHINFER_DISABLE_VERSION_CHECK=1
  TILELANG_CLEANUP_TEMP_FILES=1
  DG_JIT_USE_NVRTC=0
  DG_JIT_NVCC_COMPILER=/usr/local/cuda/bin/nvcc
  VLLM_CACHE_ROOT=/cache/huggingface/vllm-cache
  FLASHINFER_WORKSPACE_BASE=/cache/huggingface/flashinfer
  CUDA_HOME=/usr/local/cuda
  CUDA_PATH=/usr/local/cuda
  CUDAToolkit_ROOT=/usr/local/cuda
  TP_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME}
  NCCL_NET=IB
  NCCL_IB_DISABLE=0
  NCCL_IB_ROCE_VERSION_NUM=2
  NCCL_IB_ADDR_FAMILY=AF_INET
  NCCL_IB_TIMEOUT=22
  NCCL_IB_RETRY_CNT=7
  NCCL_CROSS_NIC=1
  NCCL_CUMEM_ENABLE=0
  NCCL_IGNORE_CPU_AFFINITY=1
  NCCL_NVLS_ENABLE=0
)

# JIT/compile caches (persist across boots; ${HOME} resolves per node).
EXTRA_MOUNTS=(
  -v "${HOME}/.cache/huggingface:/cache/huggingface"
)
