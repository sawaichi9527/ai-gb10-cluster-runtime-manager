# =====================================================================
# dsv41flash-tensorfold — DeepSeek-V4.1-Flash-1017 (EXL3 2.9bpw), TensorFold TP2
# =====================================================================
# Same checkpoint and Engram tables as `dsv41flash-exl3-vllm`, different
# engine. LAUNCH_STYLE="kit": the x00byte recipe owns the two-node launcher
# (`scripts/cluster.py`), so cluster-up runs it instead of rendering compose.
#
# Verified 2026-10-20:
#   - sources  : x00byte recipe + jayleaton DSV4.1 + TensorFold (ashhart) + Mia kit
#   - image    : deepseek41-tensorfold:1017 (built locally from
#                nvcr.io/nvidia/pytorch:26.07-py3; 18/18 CUDA extensions prebuilt
#                into the deepseek41-1017-tf-cache volume and shipped to node1)
#   - weights  : shared dsv41flash-1017-bundle (checkpoint -> EXL3 2.9bpw,
#                engram-src-1017 -> official 1017 Engram 47/48)
#   - engram   : packed per rank in deepseek-v4.1-flash-1017-engram-packed/
#                {head,worker} (95 GiB each; shared with the vLLM lane's format)
#   - check    : scripts/cluster.py check PASS (metadata, tokenizer, template,
#                40 image-router biases, 43 inline tensors, both images)
#   - endpoint : http://192.168.23.215:1234/v1  (SERVED_NAME=deepseek-flash)
#   - config   : 262144 context, 8 parallel, shared 1,048,576-token pool,
#                TF_DSV41_BIAS_VL=/model (1017 native vision biases)
# =====================================================================
PROFILE_ID="dsv41flash-tensorfold"
DISPLAY_NAME="DeepSeek-V4.1-Flash-1017 EXL3 2.9bpw (TensorFold TP2)"
PLACEHOLDER="false"
LAUNCH_STYLE="kit"

# ---- kit launcher (x00byte recipe; python launcher, not a shell script) ----
KIT_DIR="${HOME}/docker-stacks/x00byte-TensorFold-dsv41flash/repo"
KIT_START="python3 scripts/cluster.py start"
KIT_STOP="python3 scripts/cluster.py stop"
KIT_LOG_NAME="kit.log"
# The recipe uses the SAME container name on both ranks.
KIT_HEAD_CONTAINER="deepseek-v4.1-flash-1017-tensorfold"
KIT_WORKER_CONTAINER="deepseek-v4.1-flash-1017-tensorfold"

# ---- locally built image (not from a registry) ----
IMAGE="deepseek41-tensorfold:1017"

# ---- shared model bundle (checkpoint + engram symlinks) ----
MODELS_BASE="${HOME}/docker-stacks/models"
BODY_REL="dsv41flash-1017-bundle/checkpoint"

# ---- endpoint / boot ----
API_PORT=1234
HEALTH_TIMEOUT=1800
SERVED_MODEL="deepseek-flash"
