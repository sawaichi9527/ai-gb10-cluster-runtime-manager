#!/usr/bin/env bash
# =====================================================================
# deepseek-vision — DeepSeek V4 Flash Vision-EXP-ablit (TP2, GB10)
# ---------------------------------------------------------------------
# STATUS: live-capable (PLACEHOLDER=false). PROMOTED RECIPE
# (2026-10-09): eugr/spark-vllm-b12x + Vision-EXP-ablit, promoted from
# the deepseek-vision-b12x candidate lane after the recipe-succession
# A/B passed its gate (decode parity, prefill +9..14%, acceptance
# +1pp, all correctness gates PASS, no hotfixes required):
#   docs/DEEPSEEK_VISION_B12X_RECIPE_AB_2026-10-09.md
#   docs/evidence/vision-b12x-recipe-ab-2026-10-09/ab-{B0,B1,B2}.txt
#
# WHY (succession rationale): the previous recipe pinned
# ghcr.io/anemll/dspark-vllm-gx10:0.1.1 (believed unmaintained upstream)
# + a startup wrapper installing the ViT/Aligner encoder and 17 vendored
# MiaAI hotfixes. This image supports Vision-EXP NATIVELY (upstream
# eugr/spark-vllm-docker recipes/deepseek-v4-flash-vision-exp.yaml,
# mods: []) on a maintained nightly-CI runtime — no CMD_WRAPPER, no
# SYNC_DIRS, no patches mount at all.
#
# BACKUP SOLUTION (user decision 2026-10-09): the previous Anemll
# recipe is archived byte-identical at
#   cluster-profiles.d/_backup/deepseek-vision-anemll.conf
# with its runtime patches kept in-repo at patches/dspark-vision/
# (MIT, see NOTICE.md) — restore instructions in _backup/README.md.
# It is NOT a deployed lane; nothing here references it at runtime.
#
# PROVENANCE of the recipe below:
#   - github.com/eugr/spark-vllm-docker
#     recipes/deepseek-v4-flash-vision-exp.yaml (fetched 2026-10-09):
#     kv-cache-dtype fp8, b12x kernel trio, dspark k=6 probabilistic
#     B12X spec decode, block 256, batched 8192, num_seqs 8, GMU 0.85,
#     prefix caching ON, mods: [].
#   - cluster contract (digest pins, seccomp=unconfined for the b12x
#     loader io_uring bounce path, HEALTH_TIMEOUT 3600 for B12X JIT)
#     from cluster-profiles.d/deepseek-nvfp4.conf.
#
# DELIBERATE DEVIATION from upstream verbatim: CUDAGRAPH_CAPTURE 56
#   (not 48) = the B1 single-knob cell of the succession A/B: the
#   miaai/production formula seqs*(k+1)=8*7=56 recovered B0's C7/C8
#   deficits (capture-range fallback above 48) and put Sigma at
#   parity with the README record on TWO boots (535.3 / 545.9 vs
#   538.1, -0.5% / +1.4%). Also kept: --limit-mm-per-prompt {"image":8}
#   for mm-benchmark/capability parity with the previous recipe.
#
# MODEL: $HOME/docker-stacks/models/deepseek-v4-flash-vision-exp-ablit
#   (167.8 GB, 48 shards; abliterated official Vision-EXP — ABLIT_META:
#   26 tensors edited, layers 10-35 wo_b; ALL MTP/draft tensors are
#   byte-identical hardlinks of the official checkpoint). Mirrored to
#   BOTH nodes (node0 HF download 2026-10-09, rsync over CX7 same day).
#
# MEASURED (2026-10-09, both cells same config; README = old-recipe
# record): decode Sigma 535.3 / 545.9 vs 538.1 (-0.5% / +1.4%);
# accept 25.0 / 25.4% vs 23.95; cold prefill 131K 2007.9 / 2029.5 and
# 200K 1887.2 / 1917.0 vs 1794.1 / 1772.5 (+9..14%); KV pool 413,967
# tokens (old recipe 381,364); prefix-cache hit 32K 50.9x with
# byte-identical completions (NO hotfix needed in this fork).
# Known follow-up: bench-mm 1img C=1 sat ~11% below record in all
# three boots (single cell, unexplained) — re-check on this lane.
# =====================================================================
PROFILE_ID="deepseek-vision"
DISPLAY_NAME="DeepSeek V4 Flash Vision-EXP-ablit (eugr b12x, multimodal)"
PLACEHOLDER="false"

LAUNCH_STYLE="compose"

# Node-local stack dir (image-named + lane suffix; the old Anemll dir
# anemll-dspark-vllm-gx10-miaFlaver is retired — its compose file is
# stale on both nodes and safe to delete; the recipe is re-renderable
# from the archived conf).
STACK_DIR="${HOME}/docker-stacks/eugr-spark-vllm-b12x-vision"
COMPOSE_FILE="docker-compose.deepseek-vision.yml"
ENGINE="vllm"

# Maintained upstream runtime (DockerHub nightly CI; digests advance!)
# — byte-identical pins to deepseek-nvfp4 (see that header for the
# per-node digest rationale; re-pull / re-transfer => re-pin both).
IMAGE="eugr/spark-vllm-b12x:latest"
IMG_SHA256="sha256:036c307678dad66adbbb5a627ec8d3a0d8f9bbf8be4a679e6e441a0b2e1ab2c3"
IMG_SHA256_NODE1="sha256:dc0e9faa61d4d4133e07ec81536107b99ab741c49f198b5d4fafbc8f2466b2eb"

# Abliterated Vision-EXP checkpoint (no /drafter mount: the same-model
# DSpark draft lives in the checkpoint).
MODELS_BASE="$HOME/docker-stacks/models"
BODY_REL="deepseek-v4-flash-vision-exp-ablit"
DRAF_REL=""

# 262144 ctx / 8-way / 8192 batched (upstream recipe; MAXLEN pinned at
# the cluster-standard 256K so bench-ctx probes stay comparable).
MAXLEN="262144"
NUMSEQ="8"
BATCHED="8192"
GMU="0.85"

# No hf_quant_config.json at top level; auto-detect (same contract as
# the archived recipe — engine reports quantization=deepseek_v4_fp8).
QUANTIZATION="none"
# fp8 KV = only option for DeepSeekV4 in this image (nvfp4_ds_mla is
# structurally impossible: deepseek-nvfp4 A/B cell B, 2026-10-08 —
# three independent gates; do not retry without an upstream change).
# Measured pool 413,967 tokens > old recipe's nvfp4_ds_mla 381,364.
KV_DTYPE="fp8"

# B12X kernel trio (eugr recipe, capitalisation as upstream emits it).
ATTN_BACKEND="B12X"
LINEAR_BACKEND="b12x"
MOE_BACKEND="b12x"
# Recipe compilation config verbatim (custom_ops all -> B12X op dispatch).
COMPILATION_JSON='{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}'
CUDAGRAPH_CAPTURE="56"                  # promoted B1 cell (upstream ships 48;
                                         # see header DELIBERATE DEVIATION)
ENABLE_CHUNKED_PREFILL="true"
# Upstream recipe ON; gated in the succession A/B by the prefix-hit
# probe: PASS (50.9x, byte-identical completions, no hotfix needed).
ENABLE_PREFIX_CACHING="true"
# eugr recipe keeps custom all-reduce (loader default would disable it).
DISABLE_CUSTOM_ALL_REDUCE="false"
SHM_SIZE="64g"

# b12x loader bounce path needs io_uring (blocked by default seccomp) —
# same probe result and remedy as deepseek-nvfp4 (2026-10-07).
SECURITY_OPT=("seccomp=unconfined")

# DSpark same-model draft in-checkpoint (k=6 = previous recipe's value,
# so acceptance numbers stay comparable across succession).
SPEC_CONFIG='{"method":"dspark","num_speculative_tokens":6,"draft_sample_method":"probabilistic","attention_backend":"B12X"}'

REASONING_PARSER="deepseek_v4"
TOOL_CALL_PARSER="deepseek_v4"
ENABLE_AUTO_TOOL_CHOICE="true"

# Upstream command verbatim + --limit-mm-per-prompt (mm capability /
# benchmark parity with the archived recipe, which allowed 8 images).
EXTRA_ARGS=(
  --load-format b12x
  --block-size 256
  --tokenizer-mode deepseek_v4
  --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}'
  --default-chat-template-kwargs.thinking=true
  --default-chat-template-kwargs.reasoning_effort=high
  --distributed-executor-backend mp
  --limit-mm-per-prompt '{"image":8}'
)

# Container env: eugr vision recipe block (verbatim) + offline/lane
# cache + our RoCE/NCCL cluster contract (builder adds VLLM_HOST_IP /
# NCCL_SOCKET_IFNAME / GLOO_SOCKET_IFNAME / NCCL_IB_HCA /
# NCCL_IB_GID_INDEX / PYTORCH_CUDA_ALLOC_CONF). Anemll-image-only env
# deliberately absent — that code does not exist in this image.
EXTRA_ENV=(
  # ---- eugr recipes/deepseek-v4-flash-vision-exp.yaml env block ----
  CUTE_DSL_ARCH=sm_121a
  VLLM_USE_AOT_COMPILE=1
  VLLM_USE_BREAKABLE_CUDAGRAPH=0
  VLLM_USE_MEGA_AOT_ARTIFACT=1
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN=1
  VLLM_USE_FLASHINFER_SAMPLER=1
  VLLM_USE_B12X_WO_PROJECTION=1
  VLLM_USE_B12X_MHC=1
  VLLM_USE_B12X_FP8_GEMM=1
  VLLM_USE_B12X_MOE=1
  VLLM_USE_B12X_SPARSE_INDEXER=1
  VLLM_USE_V2_MODEL_RUNNER=1
  VLLM_MOE_SKIP_PADDING=0
  B12X_MLA_SM120_UNIFIED=1
  B12X_MOE_FORCE_A8=1
  # ---- offline + lane-local cache root ----
  HF_HUB_OFFLINE=1
  TRANSFORMERS_OFFLINE=1
  VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
  VLLM_CACHE_ROOT=/cache/vllm
  FLASHINFER_WORKSPACE_BASE=/cache/vllm/flashinfer
  # ---- RoCE/NCCL cluster contract (same as every deepseek lane) ----
  TP_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME}
  NCCL_NET=IB
  NCCL_IB_DISABLE=0
  NCCL_IB_ROCE_VERSION_NUM=2
  NCCL_IB_ADDR_FAMILY=AF_INET
  NCCL_IB_TIMEOUT=22
  NCCL_IB_RETRY_CNT=7
  NCCL_CROSS_NIC=1
  NCCL_CUMEM_ENABLE=0
  NCCL_IGNORE_CPU_AFFINITY=1
  NCCL_NVLS_ENABLE=0
)

# Lane-isolated JIT/compile cache root — the SAME root the succession
# A/B boots used (warm, proven; name marks the b12x runtime class and
# keeps it apart from the archived Anemll lane's cache artifacts).
# No CMD_WRAPPER, no SYNC_DIRS: this recipe needs no patches.
EXTRA_MOUNTS=(
  -v "${HOME}/.cache/vllm-deepseek-vision-b12x:/cache/vllm"
)

# Per-boot FlashInfer autotune reset follows this (see cluster-common.sh).
AUTOTUNE_CACHE_REL=".cache/vllm-deepseek-vision-b12x/flashinfer_autotune_cache"

# B12X kernels JIT-compile on first use (build metadata, not prebuilt
# CUDA) -> first cold boot can exceed the 2400s default (27b precedent).
HEALTH_TIMEOUT="3600"
