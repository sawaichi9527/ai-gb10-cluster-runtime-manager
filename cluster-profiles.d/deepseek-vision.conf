# =====================================================================
# deepseek-vision — DeepSeek V4 Flash Vision Exp (TP2, vLLM)
# ---------------------------------------------------------------------
# STATUS: live (PLACEHOLDER=false). Image pulled + digest-locked on both
# nodes; checkpoint present at $HOME/docker-stacks/models/deepseek-v4-flash-vision-exp.
#
# Lane facts (verified recipe https://recipes.vllm.ai/deepseek-ai/DeepSeek-V4-Flash-Vision-Exp):
#   * official DeepSeek-V4-Flash-Vision-Exp checkpoint (~168GB, 48 shards)
#   * same-model fused DSpark draft (no separate /drafter mount)
#   * pinned vLLM image: vllm/vllm-openai:deepseekv4-flash-vision
#     (upstream support PR #54566, merged 2026-09-02); IMG_SHA256 locked
#     to the registry manifest digest and verified on both nodes.
#   * conservative context 32768; tune GMU/num-seqs at bring-up.
#
# Bring-up: `gb10 use deepseek-vision` (exclusive lane — tears down the
# current TP2 stack + frees node1 singles first, then launches).
# =====================================================================
PROFILE_ID="deepseek-vision"
DISPLAY_NAME="DeepSeek V4 Flash Vision Exp (vLLM multimodal, 32K)"
PLACEHOLDER="false"

# Launch mechanism: compose (deepseek lane family). cluster-up renders the
# compose file per launch from the same build_vllm_args/build_docker_env
# builders as the docker-run path (zero runtime drift).
LAUNCH_STYLE="compose"
ENGINE="vllm"

# Per-profile image (pinned vLLM vision runtime).
IMAGE="vllm/vllm-openai:deepseekv4-flash-vision"
# IMG_SHA256 — registry manifest digest, locked after pull on BOTH nodes.
# verify_profile_image_gate compares .RepoDigests on node0 (classic image
# store) and node1 (containerd image store) and fails fast on mismatch.
IMG_SHA256="sha256:0075fd82e3b6d943b0aa91e35da8dbca63d88516c607745131055e9d81f37ebb"

# Official checkpoint (same-model DSpark draft: no /drafter mount).
MODELS_BASE="$HOME/docker-stacks/models"
BODY_REL="deepseek-v4-flash-vision-exp"
DRAF_REL=""

# Conservative context / concurrency / GMU (vision exp lane; 32K vs 262144
# deepseek mainline because multimodal prefill is heavier).
MAXLEN="32768"
NUMSEQ="4"
BATCHED="8192"
GMU="0.80"

# Model-specific vLLM settings (profile-owned).
QUANTIZATION="none"                        # checkpoint config carries its own quant method
KV_DTYPE="fp8"                             # recipe: --kv-cache-dtype fp8 (not fp8_e4m3 default)
GRAPH_MODE="FULL_AND_PIECEWISE"
CUDAGRAPH_CAPTURE="8"
ENABLE_CHUNKED_PREFILL="true"
ENABLE_PREFIX_CACHING="false"
DISABLE_CUSTOM_ALL_REDUCE="false"          # recipe contract (custom all-reduce stays on)
SHM_SIZE="64g"

# DSpark same-model fused draft (recipe: 3 spec tokens, probabilistic).
# NOTE: enable_adaptive_verification MUST stay false — the auto-selected
# DeepseekV4IndexerBackend attention backend rejects on-device verification
# trimming (bring-up 2026-09-19: adaptive=true => EngineCore init failure
# "Adaptive verification trims verification requests on device ...").
# No "model" field: served from /model mount.
SPEC_CONFIG='{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic","enable_adaptive_verification":false}'
# OpenAI tool parsing — mirror deepseek mainline; re-validate vs recipe
# client (plain chat, no tools) at bring-up.
ENABLE_AUTO_TOOL_CHOICE="true"
TOOL_CALL_PARSER="deepseek_v4"

# Verbatim vLLM extras from the verified recipe (serving-critical subset).
EXTRA_ARGS=(
  --block-size 256
  --tokenizer-mode deepseek_v4
  --async-scheduling
  --distributed-executor-backend mp
  --enable-flashinfer-autotune
)
# --allowed-local-media-path deliberately NOT set: clients send base64 / http
# URLs (recipe guidance). Add it only if a file:// media workflow appears.

# Container env: offline weights + GB10 arch + cache roots + RoCE/NCCL
# contract (consistent with the deepseek mainline lane).
EXTRA_ENV=(
  HF_HUB_OFFLINE=1
  TRANSFORMERS_OFFLINE=1
  VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
  VLLM_FLASHINFER_AUTOTUNE_SKIP_OPS="trtllm_fp4_block_scale_moe,flashinfer::trtllm_fp4_block_scale_moe"
  TORCH_CUDA_ARCH_LIST=12.1a
  FLASHINFER_CUDA_ARCH_LIST=12.1a
  CUTE_DSL_ARCH=sm_121a
  FLASHINFER_DISABLE_VERSION_CHECK=1
  VLLM_CACHE_ROOT=/cache/huggingface/vllm-cache
  FLASHINFER_WORKSPACE_BASE=/cache/huggingface/flashinfer
  TP_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME}
  NCCL_NET=IB
  NCCL_IB_DISABLE=0
  NCCL_IB_ROCE_VERSION_NUM=2
  NCCL_IB_ADDR_FAMILY=AF_INET
  NCCL_IB_TIMEOUT=22
  NCCL_IB_RETRY_CNT=7
  NCCL_CROSS_NIC=1
  NCCL_CUMEM_ENABLE=0
  NCCL_IGNORE_CPU_AFFINITY=1
  NCCL_NVLS_ENABLE=0
)

# JIT/compile + autotune caches (persist across boots; ${HOME} resolves per
# node). TP2 FlashInfer autotune cache reset (ensure_autotune_cache_reset)
# clears ~/.cache/huggingface/vllm-cache/flashinfer_autotune_cache BEFORE
# every boot — the mounted VLLM_CACHE_ROOT above matches that path.
EXTRA_MOUNTS=(
  -v "${HOME}/.cache/huggingface:/cache/huggingface"
)