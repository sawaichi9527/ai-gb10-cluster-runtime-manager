# =====================================================================
# deepseek-vision — DeepSeek V4 Flash Vision-Exp (TP2, GB10 native)
# ---------------------------------------------------------------------
# STATUS: live-capable (PLACEHOLDER=false). SAME image as the mainline
# deepseek profile (Anemll ghcr.io/anemll/dspark-vllm-gx10:0.1.1, same
# manifest digest); vision support is a STARTUP WRAPPER (CMD_WRAPPER) that
# installs the ViT/Aligner encoder + applies the community hotfixes INSIDE
# the container before `vllm serve` — the same mechanism as
# MiaAI-Lab/DeepSeek-v4-Flash-DSpark-2x-DGX-Spark (their default image is
# this exact image). Nothing here alters the deepseek profile.
#
# Weights: $HOME/docker-stacks/models/deepseek-v4-flash-vision-exp
#   revision 6821d6ad3681a4b137b066b76094fa82ebd0a380 (= HF main HEAD).
#   MiaAI pins 86f746b36186f0e567729a5c06a8c918caba82a9; the two differ ONLY
#   in README/.eval_results — all 48 safetensors + config + tokenizer +
#   encoding/ are byte-identical, so no re-download is needed.
#
# Runtime support is vendored in-repo at patches/dspark-vision/ (MiaAI-Lab
#   MIT; see patches/dspark-vision/NOTICE.md) and bind-mounted read-only.
#
# Exclusive lane: `gb10 use deepseek-vision` tears down the live TP2 stack
# (mainline deepseek or 27b/35b) first, then launches — never concurrent.
# =====================================================================
PROFILE_ID="deepseek-vision"
DISPLAY_NAME="DeepSeek V4 Flash Vision Exp (GB10 b12x, multimodal)"
PLACEHOLDER="false"

LAUNCH_STYLE="compose"
ENGINE="vllm"

# SAME image + digest as the mainline deepseek profile.
IMAGE="ghcr.io/anemll/dspark-vllm-gx10:0.1.1"
IMG_SHA256="sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8"

# Official Vision-Exp checkpoint (same-model DSpark draft: no /drafter mount).
MODELS_BASE="$HOME/docker-stacks/models"
BODY_REL="deepseek-v4-flash-vision-exp"
DRAF_REL=""

# Context / concurrency / GMU: same as the deepseek mainline 0731 profile.
MAXLEN="262144"
NUMSEQ="8"
BATCHED="16384"
GMU="0.80"

# Model-specific vLLM settings (profile-owned; mirror the miaai/Anemll lane).
QUANTIZATION="none"
KV_DTYPE="nvfp4_ds_mla"
MOE_BACKEND="flashinfer_b12x"
GRAPH_MODE="FULL_AND_PIECEWISE"
CUDAGRAPH_CAPTURE="56"                     # miaai formula: seqs*(k+1)=8*7=56
ENABLE_CHUNKED_PREFILL="true"
ENABLE_PREFIX_CACHING="false"
DISABLE_CUSTOM_ALL_REDUCE="false"
SHM_SIZE="64g"

# DSpark (k=6: >= dspark_block_size 5 and divisible by n_predict 3).
SPEC_CONFIG='{"method":"dspark","num_speculative_tokens":6,"draft_sample_method":"probabilistic"}'
REASONING_PARSER="deepseek_v4"
TOOL_CALL_PARSER="deepseek_v4"
ENABLE_AUTO_TOOL_CHOICE="true"

# Verbatim extras from the miaai/Anemll vision recipe.
EXTRA_ARGS=(
  --async-scheduling
  --block-size 256
  --tokenizer-mode deepseek_v4
  --distributed-executor-backend mp
  --generation-config vllm
  --enable-flashinfer-autotune
  --long-prefill-token-threshold 1024
  --limit-mm-per-prompt '{"image":8}'
  --default-chat-template-kwargs '{"thinking":true,"reasoning_effort":"low"}'
)

# Container env: offline weights + GB10 arch + b12x + cache roots + RoCE/NCCL.
# Mirrors the deepseek mainline block, plus the vision-lane specifics
# (VLLM_USE_BREAKABLE_CUDAGRAPH=0 kept, per the miaai recipe).
EXTRA_ENV=(
  HF_HUB_OFFLINE=1
  TRANSFORMERS_OFFLINE=1
  VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB=256
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0
  ENABLE_VLLM_GB10_PATCH=0
  GB10_HYBRID_NVFP4_M_THRESHOLD=128
  VLLM_USE_BREAKABLE_CUDAGRAPH=0
  VLLM_USE_FLASHINFER_SAMPLER=1
  VLLM_USE_B12X_MOE=1
  MTP_NUM_TOKENS=6
  DRAFT_SAMPLE_METHOD=probabilistic
  DEFAULT_THINKING=low
  TORCH_CUDA_ARCH_LIST=12.1a
  FLASHINFER_CUDA_ARCH_LIST=12.1a
  CUTE_DSL_ARCH=sm_121a
  FLASHINFER_DISABLE_VERSION_CHECK=1
  TILELANG_CLEANUP_TEMP_FILES=1
  DG_JIT_USE_NVRTC=0
  DG_JIT_NVCC_COMPILER=/usr/local/cuda/bin/nvcc
  CUDA_HOME=/usr/local/cuda
  CUDA_PATH=/usr/local/cuda
  CUDAToolkit_ROOT=/usr/local/cuda
  TILELANG_CACHE_DIR=/cache/huggingface/tilelang-cache
  TRITON_CACHE_DIR=/cache/huggingface/triton-cache
  B12X_CUTE_COMPILE_CACHE_DIR=/cache/huggingface/b12x-cute-cache
  VLLM_CACHE_ROOT=/cache/huggingface/vllm-cache
  FLASHINFER_WORKSPACE_BASE=/cache/huggingface/flashinfer
  TP_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME}
  NCCL_NET=IB
  NCCL_IB_DISABLE=0
  NCCL_IB_ROCE_VERSION_NUM=2
  NCCL_IB_ADDR_FAMILY=AF_INET
  NCCL_IB_TIMEOUT=22
  NCCL_IB_RETRY_CNT=7
  NCCL_CROSS_NIC=1
  NCCL_CUMEM_ENABLE=0
  NCCL_IGNORE_CPU_AFFINITY=1
  NCCL_NVLS_ENABLE=0
)

# Startup wrapper (default-off hook in _compose_service). Single-quoted so
# ${...} expand at container runtime, not at profile-load time. The shared
# build_vllm_args argv is appended by the renderer as the exec line.
CMD_WRAPPER='export PATH=/usr/local/cuda/bin:/usr/local/bin:${PATH}; export CUDA_HOME=${CUDA_HOME:-/usr/local/cuda}; export CUDA_PATH=${CUDA_PATH:-${CUDA_HOME}}; export CUDAToolkit_ROOT=${CUDAToolkit_ROOT:-${CUDA_HOME}}; export LD_LIBRARY_PATH=/usr/local/cuda/lib64:${LD_LIBRARY_PATH}; cp /model/encoding/encoding_dsv4.py /usr/local/lib/python3.12/dist-packages/vllm/tokenizers/deepseek_v4_encoding.py || exit 1; python3 /opt/dspark-patches/hotfix-encoding-dsv4-issue21.py || exit 1; python3 /opt/dspark-patches/hotfix-dsv4-issue55-tool-truncation.py || exit 1; bash /opt/dspark-patches/hotfix-nvfp4-ds-mla-issue22.sh || exit 1; bash /opt/dspark-patches/hotfix-gb10-spin-wait.sh || exit 1; bash /opt/dspark-patches/hotfix-dsv4-mtp-buffer-50312.sh || exit 1; bash /opt/dspark-patches/hotfix-dsv4-skip-topk-49486.sh || exit 1; bash /opt/dspark-patches/hotfix-dsv4-dense-prefill-indexer-48407.sh || exit 1; bash /opt/dspark-patches/hotfix-dsv4-skip-empty-c128-48957.sh || exit 1; bash /opt/dspark-patches/hotfix-dsv4-flashmla-workspace-50298.sh || exit 1; bash /opt/dspark-patches/hotfix-dsv4-grammar-advance.sh || exit 1; python3 /opt/dspark-patches/hotfix-dsv4-vision-exp.py || exit 1; python3 /opt/dspark-patches/hotfix-vllm-empty-encoder-output.py || exit 1; python3 /opt/dspark-patches/hotfix-dsv4-issue27-partial-prefill-concurrency.py || exit 1; python3 /opt/dspark-patches/hotfix-dsv4-issue43-decode-fairness-and-diag.py || exit 1; python3 /opt/dspark-patches/hotfix-dsv4-issue26-hybrid-swa-min.py || exit 1; python3 /opt/dspark-patches/hotfix-dsv4-issue133-triton-specialization.py || exit 1; python3 /opt/dspark-patches/hotfix-dsv4-suppress-stops-in-reasoning.py || exit 1'

# JIT/compile caches (same root as the deepseek lane → the per-boot FlashInfer
# autotune reset in cluster-up covers this lane too) + the vendored hotfix dir.
# The patch dir is DEPLOYED to both nodes (node1 does not host the repo, and
# the compose only ships the render file): source of truth is the repo's
# patches/dspark-vision/; the runtime copy lives at $HOME/dspark-vision-patches
# on each node (same path on both, like the model weights).
EXTRA_MOUNTS=(
  -v "${HOME}/.cache/huggingface:/cache/huggingface"
  -v "${HOME}/dspark-vision-patches:/opt/dspark-patches:ro"
)

# Auto-provision the runtime patch dir on BOTH nodes from the repo source of
# truth (cluster-up SYNC_DIRS hook): Node1 does not host the repo, so the bind
# source must exist there before the worker starts. SRC is read on Node0;
# DEST is staged at this absolute path on both nodes.
SYNC_DIRS=(
  "${REPO_DIR}/patches/dspark-vision:${HOME}/dspark-vision-patches"
)
