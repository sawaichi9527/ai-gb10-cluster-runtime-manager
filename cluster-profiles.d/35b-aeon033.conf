#!/usr/bin/env bash
# =====================================================================
# 35b cluster candidate — Qwen3.6 35B-A3B on aeon-vllm-ultimate 0.33 (A/B lane)
#
# NOT a service. Single-axis campaign: the production 35b profile is copied
# verbatim except for the image generation and the knobs that belonged to 0.29.
# Promote by diffing this file against cluster-profiles.d/35b.conf.
#
# Diff vs cluster-profiles.d/35b.conf:
#   IMAGE           2026-09-18-v0.29.0-omni -> 2026-11-23-v0.33.0-omni-dflash2
#   IMG_SHA256      added (same digest on BOTH nodes)
#   EXTRA_ENV       dropped VLLM_USE_V2_MODEL_RUNNER=1
#   EXTRA_MOUNTS    dropped flash_attn_029_patched.py. Verified obsolete on
#                   2026-11-26: 0.33's flash_attn.py accepts `use_mm_prefix`
#                   in its signature (3 refs; 0.29 had 2) and qwen3_dflash2.py
#                   no longer passes it. The old bind target path also no longer
#                   exists (site-packages moved to /opt/venv/...). The 0.33
#                   release note explicitly says: do not bind Python patch files.
#   cache root      own tree (~/.cache/vllm-35b-aeon033-cluster)
#   HEALTH_TIMEOUT  raised to 3600 for the first cold boot on the new engine
# Everything else (GMU 0.80, NSPEC 6, flash_attn, bfloat16 KV, PASS_CONFIG
# fuse_allreduce_rms:false, prefix caching ON, parsers) is unchanged on purpose.
# =====================================================================
PROFILE_ID="35b-aeon033"
DISPLAY_NAME="Qwen3.6 35B-A3B (aeon 0.33 candidate)"
PLACEHOLDER="false"

LAUNCH_STYLE="compose"

STACK_DIR="${HOME}/docker-stacks/aeon-vllm-ultimate"
COMPOSE_FILE="docker-compose-35b-aeon033-cluster.yml"

HEALTH_TIMEOUT="3600"

IMAGE="ghcr.io/aeon-7/aeon-vllm-ultimate:2026-11-23-v0.33.0-omni-dflash2"
IMG_SHA256="sha256:71c2b82b3b0c97ddca9ef35b279fb745ee0abe29b762a24c8c0771cf930f11ab"

MODELS_BASE="$HOME/docker-stacks/models"
BODY_REL="qwen3.6-35b-a3b-heretic-nvfp4"
DRAF_REL="qwen3.6-35b-a3b-dflash"

MAXLEN="262144"
NUMSEQ="8"
BATCHED="16384"
GMU="0.80"
NSPEC="6"

KV_DTYPE="bfloat16"
ATTN_BACKEND="flash_attn"
SPEC_METHOD="dflash"
SPEC_ATTN_BACKEND="flash_attn"
GRAPH_MODE="FULL_AND_PIECEWISE"
PASS_CONFIG='{"fuse_allreduce_rms":false}'
REASONING_PARSER="qwen3"
TOOL_CALL_PARSER="qwen3_coder"
ENABLE_AUTO_TOOL_CHOICE="true"
ENABLE_CHUNKED_PREFILL="true"
ENABLE_PREFIX_CACHING="true"

EXTRA_ENV=(
  VLLM_CACHE_ROOT=/cache/vllm
  VLLM_ALLREDUCE_USE_FLASHINFER=0
  VLLM_USE_FLASHINFER_SAMPLER=0
)
EXTRA_MOUNTS=(
  -v "${HOME}/.cache/vllm-35b-aeon033-cluster:/cache/vllm"
)

AUTOTUNE_CACHE_REL=".cache/vllm-35b-aeon033-cluster/flashinfer_autotune_cache"
