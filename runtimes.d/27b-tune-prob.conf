RUNTIME_ID="27b-tune-prob"
DISPLAY_NAME="AEON Qwen3.8 27B (A/B: z-lab DFlash2, probabilistic draft)"
ALIASES=""
MODE="exclusive"
GROUP="llm"

# Single-node A/B lane for the 2026-11-27 27b drafter investigation.
# NOT a service: identical to runtimes.d/27b.conf except the compose below,
# which changes exactly one knob (draft_sample_method greedy -> probabilistic).
STACK_DIR="${HOME}/docker-stacks/aeon-vllm-ultimate"
COMPOSE_FILE="docker-compose-27b-tune-prob-single.yml"
ENV_FILE="${HOME}/docker-stacks/config/standalone.env"
PROJECT="aeon-vllm-27b-tune-prob"
SERVICE="vllm"
CONTAINER="aeon-vllm-27b-prob"

IDENTITY_MOUNT="/model"
HEALTH_URL="http://127.0.0.1:1234/health"
TIMEOUT="1800"

# Cache isolation (see scripts/cluster-common.sh:ensure_autotune_cache_reset):
# the single-node LLM cache MUST NOT share a root with a TP2 cluster lane
# (those use ~/.cache/vllm-<profile>-cluster) or it can desync the TP2
# FlashInfer autotune cache and deadlock a cluster boot. This runtime keeps its
# own root via the compose mount (host ~/.cache/vllm-27b-tune-prob-single).
