RUNTIME_ID="27b-tune-df2aeon"
DISPLAY_NAME="AEON Qwen3.8 27B (A/B: AEON DFlash2 K9 + lattice, probabilistic)"
ALIASES=""
MODE="exclusive"
GROUP="llm"

# Single-node A/B lane for the 2026-11-27 27b drafter investigation.
# NOT a service: identical to runtimes.d/27b.conf except the compose below,
# which swaps the drafter to AEON-7/AEON-DFlash2-Qwen3.8-27B (NVFP4 W4A16,
# 1.93 GB) and uses that repo's DGX Spark config verbatim:
#   K=9, per-batch-size lattice [[1,2,9],[3,8,7],[9,12,6],[13,16,4]],
#   attention_backend TRITON_ATTN (inside the spec config), probabilistic drafts.
# Evidence for that bundle: the drafter's configs/dgx-spark.speculative-config.json
# and recipes/dgx-spark.md (both fetched with the weights on 2026-11-27).
STACK_DIR="${HOME}/docker-stacks/aeon-vllm-ultimate"
COMPOSE_FILE="docker-compose-27b-tune-df2aeon-single.yml"
ENV_FILE="${HOME}/docker-stacks/config/standalone.env"
PROJECT="aeon-vllm-27b-tune-df2aeon"
SERVICE="vllm"
CONTAINER="aeon-vllm-27b-df2aeon"

IDENTITY_MOUNT="/model"
HEALTH_URL="http://127.0.0.1:1234/health"
TIMEOUT="1800"

# Cache isolation as above: own root ~/.cache/vllm-27b-tune-df2aeon-single.
