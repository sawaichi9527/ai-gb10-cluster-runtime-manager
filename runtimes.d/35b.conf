RUNTIME_ID="35b"
DISPLAY_NAME="AEON Qwen3.6 35B-A3B"
ALIASES="aeon-35b aeon-qwen36-35b-a3b"
MODE="exclusive"
GROUP="llm"

STACK_DIR="${HOME}/docker-stacks/aeon-vllm-omni"
COMPOSE_FILE="docker-compose.35b.yml"
ENV_FILE="${HOME}/docker-stacks/config/standalone.env"
PROJECT="aeon-vllm-35b"
SERVICE="vllm"
CONTAINER="aeon-vllm-35b"

IDENTITY_MOUNT="/model"
HEALTH_URL="http://127.0.0.1:1234/health"
TIMEOUT="1800"

# Cache isolation (see scripts/cluster-common.sh:ensure_autotune_cache_symmetry):
# the single-node LLM cache MUST NOT live under TP2's path
# (~/.cache/huggingface/vllm-cache) or it can desync the TP2 FlashInfer
# autotune cache and deadlock a cluster boot. This runtime keeps its own
# root via the compose mount (host ~/.cache/vllm-35b).
