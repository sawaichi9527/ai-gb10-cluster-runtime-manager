RUNTIME_ID="comfyui-jdaln"
DISPLAY_NAME="ComfyUI DGX-Spark opinionated (jdaln - multi-workflow)"
ALIASES="comfy2 comfy-jdaln"
MODE="exclusive"
GROUP="image"
PLACEHOLDER="false"

# Upstream: https://github.com/jdaln/ComfyUI-DGX-Spark-Docker-opinionated
# (fork of dr-vij/ComfyUI-DGX-Spark-Docker-opinionated; hobby project, ~monthly
# updates).  No published image -- this lane BUILDS its own (~25 GB) from the
# repo's Dockerfile using the author's prebuilt aarch64 wheels (flash-attn,
# onnxruntime-gpu, SageAttention), which live in Git LFS.  git-lfs MUST be
# installed on the host (~/.local/bin/git-lfs) before cloning/pulling, or the
# wheels silently degrade to pointer files and the build recompiles from source.
STACK_DIR="${HOME}/docker-stacks/comfyui-dgx-spark/ComfyUI-DGX-Spark-Docker-opinionated"
COMPOSE_FILE="docker-compose.yml"
# The upstream compose has build:. and NO image: key, so Compose derives the
# image tag from the project name: <project>-<service>.  Keep PROJECT equal to
# the directory-derived default (lowercased dir name) so that a manual
# `docker compose build` per the upstream README and `gb10-single use` both
# target the SAME tag -- do not rename this to the runtime id.
PROJECT="comfyui-dgx-spark-docker-opinionated"
# upstream compose service name is "comfy"; container_name is fixed "comfyui"
SERVICE="comfy"
CONTAINER="comfyui"
IDENTITY_MOUNT="/workspace/ComfyUI"
HEALTH_URL="http://127.0.0.1:8188/"
# FIRST boot is long: the entrypoint (in order) builds the mounted venv, pip
# installs torch cu130 (~3 GB), the aarch64 wheels, ComfyUI requirements, 33
# custom node packs, THEN downloads the asset profile models (~19 GB for
# z-image-turbo-core) -- only after all of that does main.py listen on :8188,
# so HEALTH_URL stays black the whole time.  Subsequent boots are fast (venv +
# models already on disk).  4h ceiling covers a slow WAN model pull.
TIMEOUT="14400"
