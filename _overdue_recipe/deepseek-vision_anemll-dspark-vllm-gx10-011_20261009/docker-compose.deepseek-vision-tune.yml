ax-num-batched-tokens 16384 --gpu-memory-utilization 0.80 --moe-backend flashinfer_b12x --enable-chunked-prefill --enable-prefix-caching --compilation-config \\{\\\"cudagraph_mode\\\":\\\"FULL_AND_PIECEWISE\\\"\\} --max-cudagraph-capture-size 56 --speculative-config \\{\\\"method\\\":\\\"dspark\\\"\\,\\\"num_speculative_tokens\\\":6\\,\\\"draft_sample_method\\\":\\\"probabilistic\\\"\\} --trust-remote-code --async-scheduling --block-size 256 --tokenizer-mode deepseek_v4 --distributed-executor-backend mp --generation-config vllm --enable-flashinfer-autotune --long-prefill-token-threshold 1024 --limit-mm-per-prompt \\{\\\"image\\\":8\\} --default-chat-template-kwargs \\{\\\"thinking\\\":true\\,\\\"reasoning_effort\\\":\\\"low\\\"\\}"
