      TORCH_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      CUTE_DSL_ARCH: "sm_121a"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      TILELANG_CLEANUP_TEMP_FILES: "1"
      DG_JIT_USE_NVRTC: "0"
      DG_JIT_NVCC_COMPILER: "/usr/local/cuda/bin/nvcc"
      VLLM_CACHE_ROOT: "/cache/vllm"
      FLASHINFER_WORKSPACE_BASE: "/cache/vllm/flashinfer"
      CUDA_HOME: "/usr/local/cuda"
      CUDA_PATH: "/usr/local/cuda"
      CUDAtoolkit_ROOT: "/usr/local/cuda"
      TP_SOCKET_IFNAME: "enp1s0f0np0"
      NCCL_NET: "IB"
      NCCL_IB_DISABLE: "0"
      NCCL_IB_ROCE_VERSION_NUM: "2"
      NCCL_IB_ADDR_FAMILY: "AF_INET"
      NCCL_IB_TIMEOUT: "22"
      NCCL_IB_RETRY_CNT: "7"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_NVLS_ENABLE: "0"
    volumes:
      - "/home/eye/docker-stacks/models/deepseek-v4-flash-0731-official:/model:ro"
      - "/home/eye/.cache/vllm-deepseek:/cache/vllm"
    network_mode: host
    ipc: host
    shm_size: 64g
    devices:
      - /dev/infiniband
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock: {soft: -1, hard: -1}
      stack: {soft: 67108864, hard: 67108864}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
