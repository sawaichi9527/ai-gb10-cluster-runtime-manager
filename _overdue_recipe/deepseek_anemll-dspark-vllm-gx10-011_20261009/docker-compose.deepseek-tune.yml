name: tp2-deepseek-tune
services:
  worker:
    image: ghcr.io/anemll/dspark-vllm-gx10:0.1.1
    container_name: cluster-node1
    entrypoint: [vllm]
    command:
      - "serve"
      - "/model"
      - "--served-model-name"
      - "aeon"
      - "--headless"
      - "--tensor-parallel-size"
      - "2"
      - "--nnodes"
      - "2"
      - "--node-rank"
      - "1"
      - "--master-addr"
      - "10.0.101.101"
      - "--master-port"
      - "29501"
      - "--kv-cache-dtype"
      - "nvfp4_ds_mla"
      - "--max-model-len"
      - "262144"
      - "--max-num-seqs"
      - "8"
      - "--max-num-batched-tokens"
      - "16384"
      - "--gpu-memory-utilization"
      - "0.80"
      - "--moe-backend"
      - "flashinfer_b12x"
      - "--enable-chunked-prefill"
      - "--no-enable-prefix-caching"
      - "--compilation-config"
      - "{\"cudagraph_mode\":\"FULL_AND_PIECEWISE\"}"
      - "--max-cudagraph-capture-size"
      - "8"
      - "--speculative-config"
      - "{\"method\":\"dspark\",\"num_speculative_tokens\":7,\"draft_sample_method\":\"greedy\"}"
      - "--trust-remote-code"
      - "--async-scheduling"
      - "--tokenizer-mode"
      - "deepseek_v4"
      - "--generation-config"
      - "vllm"
      - "--enable-flashinfer-autotune"
      - "--distributed-executor-backend"
      - "mp"
    environment:
      VLLM_HOST_IP: "10.0.101.102"
      NCCL_SOCKET_IFNAME: "enp1s0f0np0"
      GLOO_SOCKET_IFNAME: "enp1s0f0np0"
      NCCL_IB_HCA: "rocep1s0f0:1"
      NCCL_IB_GID_INDEX: "3"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
      ENABLE_VLLM_GB10_PATCH: "0"
      GB10_HYBRID_NVFP4_M_THRESHOLD: "128"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_USE_B12X_MOE: "1"
      TORCH_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      CUTE_DSL_ARCH: "sm_121a"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      TILELANG_CLEANUP_TEMP_FILES: "1"
      DG_JIT_USE_NVRTC: "0"
      DG_JIT_NVCC_COMPILER: "/usr/local/cuda/bin/nvcc"
      VLLM_CACHE_ROOT: "/cache/vllm"
      FLASHINFER_WORKSPACE_BASE: "/cache/vllm/flashinfer"
      CUDA_HOME: "/usr/local/cuda"
      CUDA_PATH: "/usr/local/cuda"
      CUDAtoolkit_ROOT: "/usr/local/cuda"
      TP_SOCKET_IFNAME: "enp1s0f0np0"
      NCCL_NET: "IB"
      NCCL_IB_DISABLE: "0"
      NCCL_IB_ROCE_VERSION_NUM: "2"
      NCCL_IB_ADDR_FAMILY: "AF_INET"
      NCCL_IB_TIMEOUT: "22"
      NCCL_IB_RETRY_CNT: "7"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_NVLS_ENABLE: "0"
    volumes:
      - "/home/eye/docker-stacks/models/deepseek-v4-flash-0731-official:/model:ro"
      - "/home/eye/.cache/vllm-deepseek:/cache/vllm"
    network_mode: host
    ipc: host
    shm_size: 64g
    devices:
      - /dev/infiniband
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock: {soft: -1, hard: -1}
      stack: {soft: 67108864, hard: 67108864}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  head:
    image: ghcr.io/anemll/dspark-vllm-gx10:0.1.1
    container_name: cluster-node0
    entrypoint: [vllm]
    command:
      - "serve"
      - "/model"
      - "--served-model-name"
      - "aeon"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "1234"
      - "--tensor-parallel-size"
      - "2"
      - "--nnodes"
      - "2"
      - "--node-rank"
      - "0"
      - "--master-addr"
      - "10.0.101.101"
      - "--master-port"
      - "29501"
      - "--kv-cache-dtype"
      - "nvfp4_ds_mla"
      - "--max-model-len"
      - "262144"
      - "--max-num-seqs"
      - "8"
      - "--max-num-batched-tokens"
      - "16384"
      - "--gpu-memory-utilization"
      - "0.80"
      - "--moe-backend"
      - "flashinfer_b12x"
      - "--enable-chunked-prefill"
      - "--no-enable-prefix-caching"
      - "--compilation-config"
      - "{\"cudagraph_mode\":\"FULL_AND_PIECEWISE\"}"
      - "--max-cudagraph-capture-size"
      - "8"
      - "--speculative-config"
      - "{\"method\":\"dspark\",\"num_speculative_tokens\":7,\"draft_sample_method\":\"greedy\"}"
      - "--tool-call-parser"
      - "deepseek_v4"
      - "--enable-auto-tool-choice"
      - "--trust-remote-code"
      - "--async-scheduling"
      - "--tokenizer-mode"
      - "deepseek_v4"
      - "--generation-config"
      - "vllm"
      - "--enable-flashinfer-autotune"
      - "--distributed-executor-backend"
      - "mp"
      - "--api-key"
      - "<REDACTED:from-cluster.env>"
    environment:
      VLLM_HOST_IP: "10.0.101.101"
      NCCL_SOCKET_IFNAME: "enp1s0f0np0"
      GLOO_SOCKET_IFNAME: "enp1s0f0np0"
      NCCL_IB_HCA: "rocep1s0f0:1"
      NCCL_IB_GID_INDEX: "3"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
      ENABLE_VLLM_GB10_PATCH: "0"
